<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abschlussprüfung Nutzfahrzeug-Bremse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine ruhige Prüfungsspalte, Kopfzeile mit Name, Zeit und Fortschritt fest oben, Abgabe fest unten. */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#1d2733; --muted:#5b6775; --line:#d6dce3;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-soft:#e5f3ea; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:18px;flex:1 1 260px}
.bar .meta{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pill{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:14px}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
main{max-width:880px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px}
.card{scroll-margin-top:84px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.lead{max-width:65ch}
.muted{color:var(--muted)}
.sec{border-left:5px solid var(--accent)}
.sec h2{font-size:24px;margin:4px 0 10px}
.story p{margin:0 0 8px;max-width:65ch}
.story p.quote{font-style:italic}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
figure{margin:12px 0 4px}
figure .plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
figure img{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.item{display:flex;flex-direction:column;gap:12px}
.ihead{display:flex;gap:12px;align-items:flex-start}
.inr{flex:none;font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px;min-width:44px;text-align:center}
.iprompt{flex:1;max-width:65ch}
.ipts{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.kind{font-size:12px;font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tf{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.tf .st{padding:8px 0;border-bottom:1px solid var(--line)}
.tf .ch{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}
.seg{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;cursor:pointer;min-width:74px}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:4px 0}
.mlab{font-family:var(--display);font-weight:600}
.mlab b{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2px solid var(--ink);border-radius:999px;font-family:var(--mono);font-size:14px;margin-left:4px;padding:0 6px}
select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px;width:100%;max-width:520px}
.numin{display:flex;gap:10px;align-items:center}
.numin input{width:160px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.numin .unit{font-family:var(--mono)}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ord .pos{font-family:var(--mono);color:var(--muted);width:22px;text-align:right;flex:none}
.ord .tx{flex:1}
.ord button{border:1px solid var(--line);background:var(--card);border-radius:6px;width:36px;height:32px;cursor:pointer}
.ord button:disabled{opacity:.35;cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20}
.foot-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 11px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
ul.rules{margin:8px 0 0;padding-left:20px;max-width:65ch}
ul.rules li{margin:3px 0}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .card{max-width:480px;width:100%}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.secbars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sb{display:grid;grid-template-columns:minmax(150px,260px) 1fr 90px;gap:10px;align-items:center;font-size:15px}
.sb .track{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.sb .track i{display:block;height:100%;background:var(--accent)}
.sb .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rv{border-top:1px solid var(--line);padding-top:12px}
.mark{font-family:var(--mono);font-size:13px;border-radius:999px;padding:1px 8px}
.mark.ok{background:var(--good-soft);color:var(--good)}
.mark.no{background:var(--bad-soft);color:var(--bad)}
.rl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.rl li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.rl .ic{font-weight:700;text-align:center}
.rl .ic.ok{color:var(--good)} .rl .ic.no{color:var(--bad)}
.expl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15px;max-width:72ch}
.hide{display:none!important}
.note{font-size:14px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
/* Szenen: Instrumententafel und Animationen in einer eigenen, dunklen Bildwelt */
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.scene{background:#0d1217;border-radius:10px;padding:10px 10px 8px;color:#c9d3de;border:1px solid #1f2933}
.scene svg,.scene canvas{display:block;width:100%;height:auto}
.scene .cap{font-size:13px;color:#93a3b4;margin:6px 4px 0;display:flex;gap:8px;align-items:center}
.scene .cap::before{content:"";width:7px;height:7px;border-radius:50%;background:#e5484d;flex:none;animation:rec 1.6s infinite}
.scene-wide{margin-top:14px}
.scenes-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@keyframes rec{50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes idle{0%{transform:rotate(-106deg)}18%{transform:rotate(-99deg)}31%{transform:rotate(-111deg)}52%{transform:rotate(-101deg)}68%{transform:rotate(-113deg)}84%{transform:rotate(-100deg)}100%{transform:rotate(-106deg)}}
@keyframes rise{0%{transform:rotate(-8deg)}62%{transform:rotate(116deg)}100%{transform:rotate(116deg)}}
@keyframes lampLate{0%,58%{opacity:.08}60%,100%{opacity:1}}
@keyframes msgLate{0%,58%{opacity:0}62%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cycle3{0%,30%{opacity:1}33%,100%{opacity:0}}
.n-idle{animation:idle 2.2s ease-in-out infinite}
.n-rise{animation:rise 9s ease-in infinite}
.l-blink{animation:blink 1s steps(1) infinite}
.l-late{animation:lampLate 9s linear infinite}
.m-late{animation:msgLate 9s linear infinite}
.fan{animation:spin 2.8s linear infinite}
.cy{opacity:0;animation:cycle3 7.5s infinite}
.cy.c2{animation-delay:2.5s}.cy.c3{animation-delay:5s}
.secnav{display:flex;gap:6px}
.secnav button{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer}
.secnav button.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
@keyframes roadmove{to{transform:translateY(40px)}}
@keyframes drift{0%,8%{transform:translateX(0) rotate(0)}70%,88%{transform:translateX(64px) rotate(7deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes glow{0%{opacity:.35}100%{opacity:1}}
.road{animation:roadmove .7s linear infinite}
.drift{animation:drift 6s ease-in-out infinite}
.disc{animation:spin 1.1s linear infinite}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
.g1{animation:spin 2.4s linear infinite}
.g2{animation:spin 7s linear infinite reverse}
@media (max-width:760px){.sec-grid,.hero,.scenes-2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.cy.c1{opacity:1}.l-late,.m-late{opacity:1}}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.sb{grid-template-columns:1fr 70px}.sb .track{grid-column:1/-1;order:3}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Gestaltung v2: ruhige, professionelle Prüfungsoptik ===== */
:root{--accent:#1f4e79;--accent-soft:#e8eff7;--amber:#d98e04;--navy:#0f1b2a;--shadow:0 1px 2px rgba(15,27,42,.06),0 4px 14px rgba(15,27,42,.05)}
:root{--head-bg:#f7f9fb;--zebra:#f6f8fa;--quote-bg:#fbf6ea;--quote-ink:#3d3220;--big-ink:#0f1b2a}
:root[data-theme="dark"]{--head-bg:#202933;--zebra:#1f2730;--quote-bg:#2a2414;--quote-ink:#e9dcc0;--big-ink:#e4e9ef;--navy:#0b131c;--accent:#7fb0e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head-bg:#202933;--zebra:#1f2730;--quote-bg:#2a2414;--quote-ink:#e9dcc0;--big-ink:#e4e9ef;--navy:#0b131c;--accent:#7fb0e0}}
body{background:var(--paper)}
.bar{background:var(--navy);border-bottom:none;color:#e8eef5}
.bar h1{color:#fff;font-size:17px;letter-spacing:.01em}
.bar .meta{color:#b8c4d1}
.bar .pill{background:rgba(255,255,255,.1);color:#fff}
.bar .pill.warn{background:#b3261e;color:#fff}
.bar .tbtn{color:#b8c4d1;border-color:rgba(255,255,255,.25)}
.secnav button{background:rgba(255,255,255,.08);color:#dfe7ef;border-color:rgba(255,255,255,.18)}
.secnav button.full{background:#2e7d4f;color:#fff}
.prog{height:4px;background:#1c2b3c}
.prog i{background:var(--amber)}
.card{border-radius:12px;box-shadow:var(--shadow);border-color:var(--line)}
.hero-card{background:linear-gradient(135deg,#0f1b2a 0%,#1d3550 100%);color:#e8eef5;border:none;padding:28px}
.hero-card .eyebrow{color:#f2b544}
.hero-card h2{color:#fff}
.hero-card .lead{color:#c9d5e2}
.hero-card .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.hero-card .scene{border-color:#2c3e52}
.sec{border-left:none;border-top:4px solid var(--accent);padding-top:22px}
.sechead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.secno{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.sec h2{margin:0}
.secmeta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.story{margin-top:10px}
.story p.quote{border-left:3px solid var(--amber);padding:6px 12px;background:var(--quote-bg);border-radius:0 8px 8px 0;font-style:normal;color:var(--quote-ink)}

.item{padding:0;gap:0;overflow:hidden}
.item>*{margin-left:20px;margin-right:20px}
.item>.ihead{margin:0;padding:14px 20px;background:var(--head-bg);border-bottom:1px solid var(--line)}

.item>:nth-child(2){margin-top:16px}
.item>:last-child{margin-bottom:20px}
.item>*+*{margin-top:12px}
.inr{background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px}
.iprompt{font-weight:500}
.kind{color:var(--accent);font-weight:600;margin-bottom:2px}
.ipts{background:var(--card)}
table{font-size:14.5px;border-radius:8px;overflow:hidden}
th{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
tbody tr:nth-child(even) td{background:var(--zebra)}

figure{margin:14px 0 4px}
figure .plate{border-radius:10px;padding:10px;border-color:var(--line)}
figcaption{font-size:13.5px;font-weight:500;color:var(--muted);padding-left:10px;border-left:3px solid var(--amber)}
.opts{counter-reset:opt;gap:8px}
.opt{position:relative;counter-increment:opt;align-items:center;border-radius:10px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt::before{content:counter(opt,upper-alpha);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);background:var(--card)}
.opt.sel::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.tf{gap:0 14px}
.tf .st{padding:10px 0}
.tf .ch{padding:8px 0}
.seg{min-width:80px;border-radius:999px;font-weight:500}
.seg:first-child{border-top-right-radius:999px}
.mrow{padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mlab b{background:var(--card)}
select{border-radius:8px;padding:8px 10px}
.ord li{border-radius:10px;background:var(--card)}
.ord .pos{font-weight:600;color:var(--accent)}
.numin input{border-radius:8px;font-size:17px}
.foot{box-shadow:0 -4px 16px rgba(15,27,42,.08)}
.btn{border-radius:10px}
.big{color:var(--big-ink)}

.expl{border-left:3px solid var(--accent)}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px}
.opts.multi .opt::before{border-radius:6px}
.cloze{line-height:2.4;font-size:16px}
.cloze select{display:inline-block;width:auto;margin:2px 4px;max-width:100%;font-size:15px;padding:4px 8px;vertical-align:middle}
.tf.lab{grid-template-columns:1fr;gap:0}
.tf.lab .st{padding:12px 0 4px;font-weight:500}
.tf.lab .ch{flex-wrap:wrap;gap:6px;padding-bottom:12px}
.tf.lab .seg{min-width:64px}
.opts.multi .opt::before{border-radius:6px!important}
.zoomable img{cursor:zoom-in}
.zhint{font-weight:400;opacity:.8}
.lb{position:fixed;inset:0;z-index:200;background:rgba(10,15,20,.92);overflow:auto;padding:56px 10px 20px;text-align:center}
.lb img{background:#fff;border-radius:8px;width:max(100%,1000px);max-width:none;height:auto}
@media (min-width:1100px){.lb img{width:min(1600px,100%)}}
.lbx{position:fixed;top:10px;right:12px;z-index:201;background:#fff;color:#111;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1>Abschlussprüfung · Nfz-Bremse</h1>
  <div class="meta">
    <span id="who" class="hide"></span>
    <nav class="secnav hide" id="secnav" aria-label="Kundenaufträge"></nav>
    <span id="answered" class="pill hide" title="beantwortete Aufgaben">0 / 0</span>
    <span id="clock" class="pill hide" title="verbleibende Zeit">--:--</span>
    <button id="teacherBtn" class="tbtn hide" type="button">Lehrkraft</button>
  </div>
</div><div class="prog"><i id="progbar"></i></div></div>

<main id="app"></main>

<div class="foot hide" id="foot"><div class="foot-in">
  <span class="note" id="footnote">Antworten werden in diesem Browser zwischengespeichert.</span>
  <button class="btn" id="submitBtn" type="button">Test abgeben</button>
</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="card">
  <h2 id="mTitle" style="font-size:22px">Test abgeben?</h2>
  <p id="mText"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="btn ghost" id="mCancel" type="button">Weiter bearbeiten</button>
    <button class="btn" id="mOk" type="button">Jetzt abgeben</button>
  </div>
</div></div>

<script>
const BUNDLE = {"sections": [{"id": "A", "title": "Kundenauftrag A · Druckluftversorgung", "scene": "nfz", "story": ["Ein Lkw (zulässiges Gesamtgewicht 18 t) mit Zweikreis-Druckluftbremse und Anhängerbetrieb steht morgens mit Warnmeldung „Vorratsdruck zu niedrig“ auf dem Hof. Der Kompressor läuft nach dem Start auffällig lange.", "Beim Ablassen der Behälter tritt viel Kondenswasser aus. Abb. 1 zeigt die Anlage vereinfacht."], "fig": "f_druckluft", "figcap": "Abb. 1: Zweikreis-Zweileitungs-Druckluftbremsanlage eines Lkw (vereinfacht)"}, {"id": "B", "title": "Kundenauftrag B · Betriebs- und Feststellbremse", "story": ["An der Hinterachse sind Trommelbremsen mit S-Nocken, automatischen Gestängestellern und Kombibremszylindern verbaut. Der Fahrer meldet, dass die Bremswirkung hinten nachlässt.", "Abb. 2 zeigt einen Kombibremszylinder im Schnitt."]}, {"id": "C", "title": "Kundenauftrag C · Anhängerbremse", "story": ["Ein neuer Mitarbeiter soll den Anhänger an- und abkuppeln. Du erklärst ihm die Bremsanlage zwischen Zugfahrzeug und Anhänger."]}, {"id": "D", "title": "Kundenauftrag D · Unterschiede zur Pkw-Bremse", "story": ["Ein Auszubildender aus der Pkw-Werkstatt wechselt in die Nutzfahrzeugabteilung. Er fragt, was an der Lkw-Bremse grundlegend anders ist und worauf er bei der Diagnose achten muss."]}], "items": [{"id": "A1", "sec": "A", "type": "match", "pts": 12, "prompt": "Ordne den Marken 1 bis 12 in Abb. 1 die Bauteile zu.", "fig": null, "figcap": null, "table": null, "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}, {"id": "m6", "label": "7"}, {"id": "m7", "label": "8"}, {"id": "m8", "label": "9"}, {"id": "m9", "label": "10"}, {"id": "m10", "label": "11"}, {"id": "m11", "label": "12"}], "choices": [{"id": "c0", "t": "Kompressor"}, {"id": "c1", "t": "Luftaufbereitung (Druckregler mit Lufttrockner)"}, {"id": "c2", "t": "Vierkreisschutzventil"}, {"id": "c3", "t": "Vorratsbehälter"}, {"id": "c4", "t": "Betriebsbremsventil (Motorwagenbremsventil)"}, {"id": "c5", "t": "Membranbremszylinder"}, {"id": "c6", "t": "Kombibremszylinder"}, {"id": "c7", "t": "Feststellbremsventil (Handbremsventil)"}, {"id": "c8", "t": "Relaisventil"}, {"id": "c9", "t": "Anhängersteuerventil"}, {"id": "c10", "t": "Kupplungskopf Vorrat"}, {"id": "c11", "t": "Kupplungskopf Bremse"}, {"id": "c12", "t": "Hauptbremszylinder"}, {"id": "c13", "t": "Bremskraftverstärker"}, {"id": "c14", "t": "Anhängerbremsventil"}], "mlabel": "Marke"}, {"id": "A2", "sec": "A", "type": "tf", "pts": 4, "prompt": "Aussagen zum Vierkreisschutzventil. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Es teilt die Druckluft auf mehrere voneinander unabhängige Kreise auf."}, {"id": "s1", "t": "Fällt ein Kreis durch ein Leck aus, werden die intakten Kreise weiter bis zu einem Sicherungsdruck versorgt."}, {"id": "s2", "t": "Fällt der Kreis der Nebenverbraucher aus, sind auch die Betriebsbremskreise drucklos."}, {"id": "s3", "t": "Ein Leck in einem Kreis kann dazu führen, dass der Kompressor sehr lange oder dauernd fördert."}]}, {"id": "A3", "sec": "A", "type": "mc", "pts": 2, "prompt": "Welche Aufgabe hat der Lufttrockner, und wie bleibt er funktionsfähig?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Er kühlt die Druckluft, damit der Kompressor nicht überhitzt; er muss nie gewartet werden."}, {"id": "o1", "t": "Er entzieht der Druckluft Feuchtigkeit über ein Trockenmittel. Beim Abschalten wird das Trockenmittel mit bereits getrockneter Luft rückgespült (Regeneration); die Patrone wird nach Vorgabe gewechselt."}, {"id": "o2", "t": "Er filtert nur Staub aus der Ansaugluft."}, {"id": "o3", "t": "Er erhöht den Druck auf den Abschaltdruck."}, {"id": "o4", "t": "Er trennt die Kreise bei einem Leck."}]}, {"id": "A4", "sec": "A", "type": "multi", "pts": 3, "prompt": "Welche Ursachen kommen für das viele Kondenswasser in den Behältern in Frage?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Verbrauchte oder verölte Trockenmittelpatrone"}, {"id": "o1", "t": "Regeneration funktioniert nicht (z. B. Regenerationsventil oder -behälter defekt)"}, {"id": "o2", "t": "Kompressor fördert Öl, das das Trockenmittel verklebt"}, {"id": "o3", "t": "Zu alte Bremsflüssigkeit"}, {"id": "o4", "t": "Defekter Membranbremszylinder an der Vorderachse"}]}, {"id": "A5", "sec": "A", "type": "cloze", "pts": 4, "prompt": "Vervollständige den Text zur Druckregelung.", "fig": null, "figcap": null, "table": null, "parts": ["Der Druckregler schaltet den Kompressor beim ", {"g": "g0"}, " auf Leerlauf. Sinkt der Druck bis zum ", {"g": "g1"}, ", fördert der Kompressor wieder. Die Differenz zwischen beiden Werten heißt ", {"g": "g2"}, ". Fördert der Kompressor bei stehendem Fahrzeug ungewöhnlich oft, deutet das auf ", {"g": "g3"}, " hin."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "Abschaltdruck"}, {"id": "c1", "t": "Einschaltdruck"}, {"id": "c2", "t": "Sicherungsdruck"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "Einschaltdruck"}, {"id": "c1", "t": "Abschaltdruck"}, {"id": "c2", "t": "Bremsdruck"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "Schaltspanne"}, {"id": "c1", "t": "Lüftspiel"}, {"id": "c2", "t": "Ansprechzeit"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "eine Undichtigkeit"}, {"id": "c1", "t": "einen zu hohen Abschaltdruck"}, {"id": "c2", "t": "eine volle Trockenmittelpatrone"}]}]}, {"id": "B1", "sec": "B", "type": "match", "pts": 7, "prompt": "Ordne den Marken 1 bis 7 in Abb. 2 die Bauteile zu.", "fig": "f_kombi", "figcap": "Abb. 2: Kombibremszylinder im Schnitt (vereinfacht)", "table": null, "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}, {"id": "m6", "label": "7"}], "choices": [{"id": "c0", "t": "Membran (Betriebsbremsteil)"}, {"id": "c1", "t": "Anschluss Betriebsbremse"}, {"id": "c2", "t": "Anschluss Federspeicher"}, {"id": "c3", "t": "Federspeicherkolben"}, {"id": "c4", "t": "Speicherfeder"}, {"id": "c5", "t": "Mechanische Löseeinrichtung (Notlöseschraube)"}, {"id": "c6", "t": "Druckstange zum Gestängesteller"}, {"id": "c7", "t": "Entlüfterschraube"}, {"id": "c8", "t": "Hauptbremszylinder"}, {"id": "c9", "t": "Bremsbacke"}], "mlabel": "Marke"}, {"id": "B2", "sec": "B", "type": "tf", "pts": 4, "prompt": "Aussagen zur Federspeicher-Feststellbremse. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Zum Feststellen wird der Federspeicherteil entlüftet; die Feder erzeugt die Bremskraft."}, {"id": "s1", "t": "Bricht der Druck im Feststellbremskreis zusammen, fällt die Federspeicherbremse ein."}, {"id": "s2", "t": "Ist die Notlöseschraube herausgedreht, ist die Feststellbremse wieder voll wirksam."}, {"id": "s3", "t": "Ein Überlastschutzventil verhindert, dass sich Betriebsbremskraft und Federspeicherkraft am Zylinder unzulässig addieren."}]}, {"id": "B3", "sec": "B", "type": "order", "pts": 5, "prompt": "Bringe die Abläufe beim Bremsen der Hinterachse in die richtige Reihenfolge (oben = zuerst).", "fig": null, "figcap": null, "table": null, "steps": [{"id": "p0", "t": "Der Fahrer betätigt das Betriebsbremsventil"}, {"id": "p1", "t": "Ein Steuerdruck gelangt zum Relaisventil"}, {"id": "p2", "t": "Das Relaisventil leitet Vorratsluft aus dem nahen Behälter in die Bremszylinder"}, {"id": "p3", "t": "Die Membran drückt die Druckstange; der Gestängesteller verdreht die S-Nocken-Welle"}, {"id": "p4", "t": "Die Bremsbacken werden gegen die Trommel gedrückt"}]}, {"id": "B4", "sec": "B", "type": "mc", "pts": 2, "prompt": "Warum wird an der Hinterachse ein Relaisventil eingesetzt?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Um den Bremsdruck zu verdoppeln."}, {"id": "o1", "t": "Weil so die Zylinder auf kurzem Weg aus einem nahen Vorrat befüllt und entlüftet werden; Ansprech- und Lösezeit werden kürzer."}, {"id": "o2", "t": "Um die Feststellbremse zu ersetzen."}, {"id": "o3", "t": "Damit der Anhänger früher bremst."}, {"id": "o4", "t": "Um Kondenswasser abzuscheiden."}]}, {"id": "B5", "sec": "B", "type": "mc", "pts": 2, "prompt": "Welche Aufgabe hat der automatische Gestängesteller?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Er regelt den Bremsdruck nach der Beladung."}, {"id": "o1", "t": "Er gleicht den Belagverschleiß aus und hält das Lüftspiel und damit den Zylinderhub annähernd konstant."}, {"id": "o2", "t": "Er verhindert das Blockieren der Räder."}, {"id": "o3", "t": "Er löst die Federspeicherbremse im Notfall."}, {"id": "o4", "t": "Er kühlt die Trommelbremse."}]}, {"id": "B6", "sec": "B", "type": "multi", "pts": 3, "prompt": "Welche Prüfungen sind bei nachlassender Bremswirkung an der Hinterachse sinnvoll?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Zylinderhub messen und mit dem zulässigen Wert vergleichen"}, {"id": "o1", "t": "Belagdicke über die Prüföffnungen bzw. nach Vorgabe kontrollieren"}, {"id": "o2", "t": "Funktion der Gestängesteller prüfen"}, {"id": "o3", "t": "Bremsflüssigkeitsstand prüfen"}, {"id": "o4", "t": "Dicke der Bremsscheiben hinten messen"}]}, {"id": "C1", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zum An- und Abkuppeln. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Der rote Kupplungskopf gehört zur Vorratsleitung, der gelbe zur Bremsleitung."}, {"id": "s1", "t": "Beim Ankuppeln wird zuerst der gelbe, dann der rote Kupplungskopf verbunden."}, {"id": "s2", "t": "Reißt die Vorratsleitung ab, bremst der Anhänger selbsttätig aus seinem eigenen Vorratsbehälter."}, {"id": "s3", "t": "Beim Abkuppeln wird zuerst der gelbe Kupplungskopf getrennt."}]}, {"id": "C2", "sec": "C", "type": "mc", "pts": 2, "prompt": "Warum bremst der Anhänger etwas früher bzw. stärker an als das Zugfahrzeug (Voreilung)?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Damit der Anhänger weniger verschleißt."}, {"id": "o1", "t": "Damit der Zug beim Bremsen gestreckt bleibt und der Anhänger nicht auf das Zugfahrzeug aufläuft oder einknickt."}, {"id": "o2", "t": "Weil der Anhänger keine eigene Vorratsluft hat."}, {"id": "o3", "t": "Damit die Feststellbremse entlastet wird."}, {"id": "o4", "t": "Weil der Anhänger kein ABS hat."}]}, {"id": "C3", "sec": "C", "type": "mc", "pts": 2, "prompt": "Wozu dient die automatisch lastabhängige Bremskraftregelung (ALB)?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Sie verhindert das Blockieren bei Glätte."}, {"id": "o1", "t": "Sie passt den Bremsdruck an die Achslast an, damit eine leere Achse nicht überbremst wird."}, {"id": "o2", "t": "Sie regelt den Kompressor."}, {"id": "o3", "t": "Sie hält das Lüftspiel konstant."}, {"id": "o4", "t": "Sie schaltet den Retarder zu."}]}, {"id": "C4", "sec": "C", "type": "cloze", "pts": 4, "prompt": "Vervollständige den Text zur Zweileitungs-Bremsanlage.", "fig": null, "figcap": null, "table": null, "parts": ["In der Vorratsleitung steht beim Fahren ständig ", {"g": "g0"}, " an. Über die Bremsleitung wird der ", {"g": "g1"}, " übertragen, den das ", {"g": "g2"}, " im Zugfahrzeug erzeugt. Im Anhänger steuert das ", {"g": "g3"}, " die Bremszylinder aus dem Anhänger-Vorratsbehälter."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "Vorratsdruck"}, {"id": "c1", "t": "Bremsdruck"}, {"id": "c2", "t": "Atmosphärendruck"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "Steuerdruck"}, {"id": "c1", "t": "Vorratsdruck"}, {"id": "c2", "t": "Reifendruck"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "Anhängersteuerventil"}, {"id": "c1", "t": "Vierkreisschutzventil"}, {"id": "c2", "t": "Relaisventil"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "Anhängerbremsventil"}, {"id": "c1", "t": "Betriebsbremsventil"}, {"id": "c2", "t": "Druckregler"}]}]}, {"id": "D1", "sec": "D", "type": "tf", "pts": 7, "prompt": "Ordne jede Aussage zu: typisch für Pkw, typisch für schwere Lkw oder für beide.", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Die Energie zum Bremsen kommt aus einem Druckluftvorrat; der Fahrer steuert nur (Fremdkraftbremsanlage)."}, {"id": "s1", "t": "Die Muskelkraft des Fahrers wird durch einen Bremskraftverstärker unterstützt (Hilfskraftbremsanlage)."}, {"id": "s2", "t": "Die Feststellbremse wirkt über Federkraft und fällt bei Druckverlust ein."}, {"id": "s3", "t": "Die Bremsflüssigkeit nimmt Wasser auf und wird nach Zeit gewechselt."}, {"id": "s4", "t": "Kondenswasser in der Anlage, ein Lufttrockner ist nötig."}, {"id": "s5", "t": "Raddrehzahlsensoren melden den Radschlupf an ein ABS-Steuergerät."}, {"id": "s6", "t": "Eine verschleißfreie Dauerbremse (Motorbremse, Retarder) entlastet die Betriebsbremse."}], "labels": ["Pkw", "Lkw", "beide"]}, {"id": "D2", "sec": "D", "type": "mc", "pts": 3, "prompt": "Warum spricht eine konventionelle Druckluftbremse langsamer an als eine Pkw-Hydraulikbremse?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Weil Druckluft heißer ist als Bremsflüssigkeit."}, {"id": "o1", "t": "Weil Luft kompressibel ist und lange Leitungen und große Zylinder erst befüllt werden müssen; das verlängert Ansprech- und Schwelldauer."}, {"id": "o2", "t": "Weil der Kompressor erst anlaufen muss."}, {"id": "o3", "t": "Weil Lkw keine Bremskraftverstärker haben."}, {"id": "o4", "t": "Weil Trommelbremsen grundsätzlich langsamer sind."}]}, {"id": "D3", "sec": "D", "type": "tf", "pts": 4, "prompt": "Aussagen zum elektronisch gesteuerten Bremssystem (EBS). Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Der Bremswunsch wird elektrisch übertragen; Druckluft bleibt der Energieträger."}, {"id": "s1", "t": "Fällt die Elektronik aus, bremst das Fahrzeug über einen pneumatischen Notkreis (Redundanz)."}, {"id": "s2", "t": "EBS kann den Belagverschleiß zwischen den Achsen angleichen."}, {"id": "s3", "t": "Mit EBS entfällt die gelbe Bremsleitung zum Anhänger."}]}, {"id": "D4", "sec": "D", "type": "mc", "pts": 2, "prompt": "Warum sind Dauerbremsen bei schweren Nutzfahrzeugen so wichtig?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Weil die Betriebsbremse bei Lkw nur bis 50 km/h wirkt."}, {"id": "o1", "t": "Weil die Betriebsbremse bei langen Gefällen überhitzen würde (Fading); die Dauerbremse hält die Geschwindigkeit verschleißfrei."}, {"id": "o2", "t": "Weil Lkw keine Feststellbremse haben."}, {"id": "o3", "t": "Damit der Kompressor weniger fördern muss."}, {"id": "o4", "t": "Weil sie den Bremsweg bei einer Vollbremsung halbieren."}]}, {"id": "D5", "sec": "D", "type": "multi", "pts": 3, "prompt": "Der Vorratsdruck fällt über Nacht deutlich ab. Welche Prüfungen sind sinnvoll?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Anlage auf Dichtheit prüfen: abhören und Verbindungen mit Lecksuchspray prüfen"}, {"id": "o1", "t": "Druckabfall über eine festgelegte Zeit mit Manometer an den Prüfanschlüssen messen"}, {"id": "o2", "t": "Kreise einzeln betrachten, um den undichten Kreis einzugrenzen"}, {"id": "o3", "t": "Bremsflüssigkeitsstand prüfen"}, {"id": "o4", "t": "Belagdicke an der Vorderachse messen"}]}, {"id": "D6", "sec": "D", "type": "mc", "pts": 2, "prompt": "Wozu dienen die Prüfanschlüsse in der Druckluftbremsanlage?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Zum Nachfüllen von Bremsflüssigkeit."}, {"id": "o1", "t": "Zum Anschluss von Manometern bzw. Drucksensoren, um Vorrats-, Steuer- und Bremsdrücke zu messen."}, {"id": "o2", "t": "Zum Ablassen von Kondenswasser."}, {"id": "o3", "t": "Zum Aufpumpen der Reifen."}, {"id": "o4", "t": "Zum Anschluss des Anhängers."}]}, {"id": "D7", "sec": "D" const MAX = ITEMS.reduce((a, i) => a + i.pts, 0);

// ---------- Hilfen ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function load() { try { return JSON.parse(localStorage.getItem(CONFIG.STORE)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(CONFIG.STORE, JSON.stringify(S)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(n, d = 1) { return Number(n).toLocaleString("de-DE", { maximumFractionDigits: d }); }
function parseNum(s) { if (s == null) return NaN; const t = String(s).replace(/\s/g, "").replace(/[^0-9,.\-]/g, "").replace(",", "."); return t === "" ? NaN : Number(t); }
let SECRET = null;
function secret() {
  if (SECRET) return SECRET;
  const bin = atob(BUNDLE.blob); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ P.charCodeAt(i % P.length);
  SECRET = JSON.parse(new TextDecoder().decode(out)); return SECRET;
}

// ---------- Zustand ----------
let S = load() || { phase: "start", name: "", klasse: "", startedAt: 0, layout: {}, answers: {}, touched: {}, result: null };
function makeLayout() {
  const L = {};
  for (const it of ITEMS) {
    if (it.type === "mc" || it.type === "multi") L[it.id] = shuffle(it.options.map(o => o.id));
    if (it.type === "cloze") { L[it.id] = {}; for (const g of it.gaps) L[it.id][g.id] = shuffle(g.choices.map(c => c.id)); }
    if (it.type === "match") L[it.id] = shuffle(it.choices.map(c => c.id));
    if (it.type === "order") { let o; do { o = shuffle(it.steps.map(s => s.id)); } while (o.every((v, i) => v === it.steps[i].id)); L[it.id] = o; }
  }
  return L;
}
function isAnswered(it) {
  const a = S.answers[it.id];
  if (it.type === "mc") return !!a;
  if (it.type === "tf") return a && it.statements.every(s => a[s.id] !== undefined && a[s.id] !== null);
  if (it.type === "multi") return Array.isArray(a) && a.length > 0;
  if (it.type === "cloze") return a && it.gaps.every(g => a[g.id]);
  if (it.type === "match") return a && it.markers.every(m => a[m.id]);
  if (it.type === "num") return !isNaN(parseNum(a));
  if (it.type === "order") return !!S.touched[it.id];
  return false;
}

// ---------- Bewertung ----------
function gradeItem(it, a, key) {
  const k = key[it.id];
  if (it.type === "mc") return a === k ? it.pts : 0;
  if (it.type === "tf") return it.statements.reduce((s, st) => s + (a && a[st.id] === k[st.id] ? 1 : 0), 0);
  if (it.type === "multi") { const m = Array.isArray(a) ? a : []; const hit = m.filter(x => k.includes(x)).length, bad = m.length - hit; return Math.max(0, hit - bad); }
  if (it.type === "cloze") return it.gaps.reduce((s, g) => s + (a && a[g.id] === k[g.id] ? 1 : 0), 0);
  if (it.type === "match") return it.markers.reduce((s, m) => s + (a && a[m.id] === k[m.id] ? 1 : 0), 0);
  if (it.type === "num") { const v = parseNum(a); return !isNaN(v) && Math.abs(v - k.v) <= k.tol + 1e-9 ? it.pts : 0; }
  if (it.type === "order") { const o = a || []; return k.reduce((s, id, i) => s + (o[i] === id ? 1 : 0), 0); }
  return 0;
}
function noteOf(pct) { const p = Math.round(pct); return p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6; }
function grade(answers) {
  const key = secret().key; const per = {}, sec = {};
  for (const s of SEC) sec[s.id] = { got: 0, max: 0 };
  for (const it of ITEMS) { const g = gradeItem(it, answers[it.id], key); per[it.id] = g; sec[it.sec].got += g; sec[it.sec].max += it.pts; }
  const got = Object.values(per).reduce((a, b) => a + b, 0);
  const pct = Math.round(got / MAX * 1000) / 10;
  return { got, max: MAX, pct, note: noteOf(pct), per, sec };
}

let tick = null;

  document.getElementById("progbar").style.width = (S.phase === "test" ? n / ITEMS.length * 100 : 0) + "%";
  const nav = document.getElementById("secnav");
  if (!nav.childElementCount) for (const sec of SEC) nav.append(el("button", { type: "button", "data-s": sec.id, title: sec.title,

  for (const b of nav.children) { const its = ITEMS.filter(i => i.sec === b.dataset.s), k = its.filter(isAnswered).length;
    b.textContent = `${b.dataset.s} ${k}/${its.length}`; b.classList.toggle("full", k === its.length); }
}
function startClock() {
  const c = document.getElementById("clock"); c.classList.remove("hide");

    const left = Math.max(0, S.startedAt + CONFIG.MINUTES * 60000 - Date.now());

      el("button", { class: "btn ghost", type: "button", text: "Musterlösung ansehen", onclick: () => { app.querySelectorAll(".sec,.item").forEach(n => n.remove()); renderReview(null, null); } }),
      el("button", { class: "btn ghost", type: "button", text: "Zurück zum Test", onclick: () => { if (unsub) unsub(); S.phase === "test" ? renderTest() : S.phase === "done" ? renderResult() : renderStart(); } }))));
  if (!DB) { status.textContent = "Ergebnisspeicher ist in dieser Ansicht nicht verfügbar."; return; }
  const timer = setTimeout(() => { status.textContent = "Die Ergebnisse sind gerade nicht erreichbar."; }, 10000);
  if (unsub) unsub();
  unsub = DB.collection("results").orderBy("at", "desc").onSnapshot(snap => {
    clearTimeout(timer);
    status.textContent = snap.empty ? "Noch keine Abgaben gespeichert." : `${snap.size} Abgaben · Schnitt ${fmt(snap.docs.reduce((s, d) => s + (d.data().pct || 0), 0) / snap.size)} %`;
    body.replaceChildren(...snap.docs.map(d => { const x = d.data();
      return el("tr", null, el("td", { text: x.name || "?" }), el("td", { text: x.klasse || "" }), el("td", { class: "num", text: `${x.got}/${x.max}` }),
        el("td", { class: "num", text: fmt(x.pct) }), ...SEC.map(s => el("td", { class: "num", text: x.sec && x.sec[s.id] ? `${x.sec[s.id].got}/${x.sec[s.id].max}` : "" })),
        el("td", { class: "num", text: (x.minutes ?? "") + " min" }), el("td", { text: x.at ? new Date(x.at).toLocaleString("de-DE") : "" })); }));
  }, () => { clearTimeout(timer); status.textContent = "Die Ergebnisse konnten nicht geladen werden."; });
}

// ---------- Start ----------
if (S.phase === "test") { if (!S.layout || !Object.keys(S.layout).length) S.layout = makeLayout(); renderTest(); }
else if (S.phase === "done" && S.result) renderResult();
else renderStart();

</script>

<script>
// Ergebnisübermittlung an das Google-Formular und Freischaltung weiterer Versuche durch die Lehrkraft.
(function () {
  var ZIEL = "https://docs.google.com/forms/d/e/1FAIpQLScqqprIbaerhmgaWx6lF_CiJUVyXleFBCMea8aTlpB8xhh9jw/formResponse";
  var F = {"name": "entry.1310728237", "klasse": "entry.1103803953", "teil": "entry.741955321", "punkte": "entry.1144687010", "prozent": "entry.141246579", "note": "entry.1182933868", "details": "entry.1853769831"};
  var TEIL = "Nfz-Bremse";
  var CODE_HASH = "9d86f193bc7f3095c687e7c5865557cfe620345b68b1e6059ac66ed0d0dc53d5";
  function hinweis(t) { var n = document.getElementById("sendState"); if (n) n.textContent = t; }
  function senden() {
    if (typeof S === "undefined" || !S || !S.result || S.sent) return;
    var r = S.result;
    var teile = SEC.map(function (s) { return s.id + " " + r.sec[s.id].got + "/" + r.sec[s.id].max; }).join(" · ");
    var p = new URLSearchParams();
    p.append(F.name, S.name || "");
    p.append(F.klasse, S.klasse || "");
    p.append(F.punkte, r.got + "/" + r.max);
    p.append(F.prozent, String(r.pct).replace(".", ","));
    if (F.teil) p.append(F.teil, TEIL);
    if (F.note) p.append(F.note, String(r.note || noteOf(r.pct)));
    p.append(F.details, (F.teil ? "" : TEIL + " · ") + (F.note ? "" : "Note " + (r.note || noteOf(r.pct)) + " · ") + teile + " · " + r.minutes + " min" + (r.auto ? " · automatisch abgegeben" : "") + (S.attempt > 1 ? " · Versuch " + S.attempt : "") + " · " + new Date(r.at).toLocaleString("de-DE"));
    fetch(ZIEL, { method: "POST", mode: "no-cors", body: p })
      .then(function () { S.sent = true; save(); hinweis("Ergebnis an die Lehrkraft übermittelt."); })
      .catch(function () { hinweis("Ergebnis konnte nicht übermittelt werden. Bitte zeig es deiner Lehrkraft."); });
  }
  async function codeStimmt(code) {
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ap-kfz:" + code));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("") === CODE_HASH;
  }
  function freischaltBereich() {
    var karte = document.querySelector("#app section.card");
    if (!karte || !S || S.phase !== "done") return;
    var box = el("div", { style: "margin-top:16px;border-top:1px solid var(--line);padding-top:10px" });
    var knopf = el("button", { type: "button", class: "tbtn", text: "Lehrkraft" });
    var form = el("div", { class: "row hide", style: "margin-top:8px;align-items:center" });
    var feld = el("input", { type: "password", inputmode: "numeric", autocomplete: "off", id: "lkcode", "aria-label": "Code der Lehrkraft", placeholder: "Code",
      style: "border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;width:130px" });
    var ok = el("button", { type: "button", class: "btn", text: "Neuen Versuch freischalten" });
    var meldung = el("p", { class: "note" });
    knopf.addEventListener("click", function () { form.classList.toggle("hide"); feld.focus(); });
    async function freischalten() {
      if (await codeStimmt(feld.value.trim())) {
        var n = (S.attempt || 1) + 1;
        S = { phase: "start", name: S.name, klasse: S.klasse, startedAt: 0, layout: {}, answers: {}, touched: {}, result: null, sent: false, attempt: n };
        save();
        renderStart("Versuch " + n + " ist freigeschaltet. Starte, wenn du bereit bist.");
      } else { meldung.textContent = "Code falsch."; feld.value = ""; feld.focus(); }
    }
    ok.addEventListener("click", freischalten);
    feld.addEventListener("keydown", function (e) { if (e.key === "Enter") freischalten(); });
    form.append(feld, ok); box.append(knopf, form, meldung); karte.append(box);
  }
  var abgeben = window.submit;
  window.submit = function (auto) { var x = abgeben(auto); senden(); return x; };
  var zeigen = window.renderResult;
  window.renderResult = function () { var x = zeigen.apply(this, arguments); freischaltBereich(); return x; };
  if (S && S.phase === "done" && S.result) window.renderResult();
  senden();
})();
</script>
