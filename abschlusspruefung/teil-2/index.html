<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abschlussprüfung Teil 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine ruhige Prüfungsspalte, Kopfzeile mit Name, Zeit und Fortschritt fest oben, Abgabe fest unten. */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#1d2733; --muted:#5b6775; --line:#d6dce3;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-soft:#e5f3ea; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:18px;flex:1 1 260px}
.bar .meta{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pill{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:14px}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
main{max-width:880px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px}
.card{scroll-margin-top:84px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.lead{max-width:65ch}
.muted{color:var(--muted)}
.sec{border-left:5px solid var(--accent)}
.sec h2{font-size:24px;margin:4px 0 10px}
.story p{margin:0 0 8px;max-width:65ch}
.story p.quote{font-style:italic}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
figure{margin:12px 0 4px}
figure .plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
figure img{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.item{display:flex;flex-direction:column;gap:12px}
.ihead{display:flex;gap:12px;align-items:flex-start}
.inr{flex:none;font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px;min-width:44px;text-align:center}
.iprompt{flex:1;max-width:65ch}
.ipts{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.kind{font-size:12px;font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tf{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.tf .st{padding:8px 0;border-bottom:1px solid var(--line)}
.tf .ch{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}
.seg{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;cursor:pointer;min-width:74px}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:4px 0}
.mlab{font-family:var(--display);font-weight:600}
.mlab b{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2px solid var(--ink);border-radius:999px;font-family:var(--mono);font-size:14px;margin-left:4px;padding:0 6px}
select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px;width:100%;max-width:520px}
.numin{display:flex;gap:10px;align-items:center}
.numin input{width:160px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.numin .unit{font-family:var(--mono)}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ord .pos{font-family:var(--mono);color:var(--muted);width:22px;text-align:right;flex:none}
.ord .tx{flex:1}
.ord button{border:1px solid var(--line);background:var(--card);border-radius:6px;width:36px;height:32px;cursor:pointer}
.ord button:disabled{opacity:.35;cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20}
.foot-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 11px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
ul.rules{margin:8px 0 0;padding-left:20px;max-width:65ch}
ul.rules li{margin:3px 0}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .card{max-width:480px;width:100%}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.secbars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sb{display:grid;grid-template-columns:minmax(150px,260px) 1fr 90px;gap:10px;align-items:center;font-size:15px}
.sb .track{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.sb .track i{display:block;height:100%;background:var(--accent)}
.sb .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rv{border-top:1px solid var(--line);padding-top:12px}
.mark{font-family:var(--mono);font-size:13px;border-radius:999px;padding:1px 8px}
.mark.ok{background:var(--good-soft);color:var(--good)}
.mark.no{background:var(--bad-soft);color:var(--bad)}
.rl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.rl li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.rl .ic{font-weight:700;text-align:center}
.rl .ic.ok{color:var(--good)} .rl .ic.no{color:var(--bad)}
.expl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15px;max-width:72ch}
.hide{display:none!important}
.note{font-size:14px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
/* Szenen: Instrumententafel und Animationen in einer eigenen, dunklen Bildwelt */
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.scene{background:#0d1217;border-radius:10px;padding:10px 10px 8px;color:#c9d3de;border:1px solid #1f2933}
.scene svg,.scene canvas{display:block;width:100%;height:auto}
.scene .cap{font-size:13px;color:#93a3b4;margin:6px 4px 0;display:flex;gap:8px;align-items:center}
.scene .cap::before{content:"";width:7px;height:7px;border-radius:50%;background:#e5484d;flex:none;animation:rec 1.6s infinite}
.scene-wide{margin-top:14px}
.scenes-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@keyframes rec{50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes idle{0%{transform:rotate(-106deg)}18%{transform:rotate(-99deg)}31%{transform:rotate(-111deg)}52%{transform:rotate(-101deg)}68%{transform:rotate(-113deg)}84%{transform:rotate(-100deg)}100%{transform:rotate(-106deg)}}
@keyframes rise{0%{transform:rotate(-8deg)}62%{transform:rotate(116deg)}100%{transform:rotate(116deg)}}
@keyframes lampLate{0%,58%{opacity:.08}60%,100%{opacity:1}}
@keyframes msgLate{0%,58%{opacity:0}62%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cycle3{0%,30%{opacity:1}33%,100%{opacity:0}}
.n-idle{animation:idle 2.2s ease-in-out infinite}
.n-rise{animation:rise 9s ease-in infinite}
.l-blink{animation:blink 1s steps(1) infinite}
.l-late{animation:lampLate 9s linear infinite}
.m-late{animation:msgLate 9s linear infinite}
.fan{animation:spin 2.8s linear infinite}
.cy{opacity:0;animation:cycle3 7.5s infinite}
.cy.c2{animation-delay:2.5s}.cy.c3{animation-delay:5s}
.secnav{display:flex;gap:6px}
.secnav button{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer}
.secnav button.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
@keyframes roadmove{to{transform:translateY(40px)}}
@keyframes drift{0%,8%{transform:translateX(0) rotate(0)}70%,88%{transform:translateX(64px) rotate(7deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes glow{0%{opacity:.35}100%{opacity:1}}
.road{animation:roadmove .7s linear infinite}
.drift{animation:drift 6s ease-in-out infinite}
.disc{animation:spin 1.1s linear infinite}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
.g1{animation:spin 2.4s linear infinite}
.g2{animation:spin 7s linear infinite reverse}
@media (max-width:760px){.sec-grid,.hero,.scenes-2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.cy.c1{opacity:1}.l-late,.m-late{opacity:1}}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.sb{grid-template-columns:1fr 70px}.sb .track{grid-column:1/-1;order:3}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Gestaltung v2: ruhige, professionelle Prüfungsoptik ===== */
:root{--accent:#1f4e79;--accent-soft:#e8eff7;--amber:#d98e04;--navy:#0f1b2a;--shadow:0 1px 2px rgba(15,27,42,.06),0 4px 14px rgba(15,27,42,.05)}
:root{--head-bg:#f7f9fb;--zebra:#f6f8fa;--quote-bg:#fbf6ea;--quote-ink:#3d3220;--big-ink:#0f1b2a}
:root[data-theme="dark"]{--head-bg:#202933;--zebra:#1f2730;--quote-bg:#2a2414;--quote-ink:#e9dcc0;--big-ink:#e4e9ef;--navy:#0b131c;--accent:#7fb0e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head-bg:#202933;--zebra:#1f2730;--quote-bg:#2a2414;--quote-ink:#e9dcc0;--big-ink:#e4e9ef;--navy:#0b131c;--accent:#7fb0e0}}
body{background:var(--paper)}
.bar{background:var(--navy);border-bottom:none;color:#e8eef5}
.bar h1{color:#fff;font-size:17px;letter-spacing:.01em}
.bar .meta{color:#b8c4d1}
.bar .pill{background:rgba(255,255,255,.1);color:#fff}
.bar .pill.warn{background:#b3261e;color:#fff}
.bar .tbtn{color:#b8c4d1;border-color:rgba(255,255,255,.25)}
.secnav button{background:rgba(255,255,255,.08);color:#dfe7ef;border-color:rgba(255,255,255,.18)}
.secnav button.full{background:#2e7d4f;color:#fff}
.prog{height:4px;background:#1c2b3c}
.prog i{background:var(--amber)}
.card{border-radius:12px;box-shadow:var(--shadow);border-color:var(--line)}
.hero-card{background:linear-gradient(135deg,#0f1b2a 0%,#1d3550 100%);color:#e8eef5;border:none;padding:28px}
.hero-card .eyebrow{color:#f2b544}
.hero-card h2{color:#fff}
.hero-card .lead{color:#c9d5e2}
.hero-card .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.hero-card .scene{border-color:#2c3e52}
.sec{border-left:none;border-top:4px solid var(--accent);padding-top:22px}
.sechead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.secno{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--navy);color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.sec h2{margin:0}
.secmeta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.story{margin-top:10px}
.story p.quote{border-left:3px solid var(--amber);padding:6px 12px;background:var(--quote-bg);border-radius:0 8px 8px 0;font-style:normal;color:var(--quote-ink)}

.item{padding:0;gap:0;overflow:hidden}
.item>*{margin-left:20px;margin-right:20px}
.item>.ihead{margin:0;padding:14px 20px;background:var(--head-bg);border-bottom:1px solid var(--line)}

.item>:nth-child(2){margin-top:16px}
.item>:last-child{margin-bottom:20px}
.item>*+*{margin-top:12px}
.inr{background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px}
.iprompt{font-weight:500}
.kind{color:var(--accent);font-weight:600;margin-bottom:2px}
.ipts{background:var(--card)}
table{font-size:14.5px;border-radius:8px;overflow:hidden}
th{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
tbody tr:nth-child(even) td{background:var(--zebra)}

figure{margin:14px 0 4px}
figure .plate{border-radius:10px;padding:10px;border-color:var(--line)}
figcaption{font-size:13.5px;font-weight:500;color:var(--muted);padding-left:10px;border-left:3px solid var(--amber)}
.opts{counter-reset:opt;gap:8px}
.opt{position:relative;counter-increment:opt;align-items:center;border-radius:10px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt::before{content:counter(opt,upper-alpha);flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);background:var(--card)}
.opt.sel::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.tf{gap:0 14px}
.tf .st{padding:10px 0}
.tf .ch{padding:8px 0}
.seg{min-width:80px;border-radius:999px;font-weight:500}
.seg:first-child{border-top-right-radius:999px}
.mrow{padding:6px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mlab b{background:var(--card)}
select{border-radius:8px;padding:8px 10px}
.ord li{border-radius:10px;background:var(--card)}
.ord .pos{font-weight:600;color:var(--accent)}
.numin input{border-radius:8px;font-size:17px}
.foot{box-shadow:0 -4px 16px rgba(15,27,42,.08)}
.btn{border-radius:10px}
.big{color:var(--big-ink)}

.expl{border-left:3px solid var(--accent)}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px}
.opts.multi .opt::before{border-radius:6px}
.cloze{line-height:2.4;font-size:16px}
.cloze select{display:inline-block;width:auto;margin:2px 4px;max-width:100%;font-size:15px;padding:4px 8px;vertical-align:middle}
.tf.lab{grid-template-columns:1fr;gap:0}
.tf.lab .st{padding:12px 0 4px;font-weight:500}
.tf.lab .ch{flex-wrap:wrap;gap:6px;padding-bottom:12px}
.tf.lab .seg{min-width:64px}
.opts.multi .opt::before{border-radius:6px!important}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1>Abschlussprüfung · Teil 2</h1>
  <div class="meta">
    <span id="who" class="hide"></span>
    <nav class="secnav hide" id="secnav" aria-label="Kundenaufträge"></nav>
    <span id="answered" class="pill hide" title="beantwortete Aufgaben">0 / 0</span>
    <span id="clock" class="pill hide" title="verbleibende Zeit">--:--</span>
    <button id="teacherBtn" class="tbtn hide" type="button">Lehrkraft</button>
  </div>
</div><div class="prog"><i id="progbar"></i></div></div>

<main id="app"></main>

<div class="foot hide" id="foot"><div class="foot-in">
  <span class="note" id="footnote">Antworten werden in diesem Browser zwischengespeichert.</span>
  <button class="btn" id="submitBtn" type="button">Test abgeben</button>
</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="card">
  <h2 id="mTitle" style="font-size:22px">Test abgeben?</h2>
  <p id="mText"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="btn ghost" id="mCancel" type="button">Weiter bearbeiten</button>
    <button class="btn" id="mOk" type="button">Jetzt abgeben</button>
  </div>
</div></div>

<script>
const BUNDLE = {"sections": [{"id": "A", "title": "Kundenauftrag A · Fahrwerk und Lenkung", "scene": "drift", "story": ["Bei einem Kompaktwagen wurden in einer anderen Werkstatt Querlenker hinten und Spurstangen vorne erneuert. Seitdem steht das Lenkrad bei Geradeausfahrt schief, und der Spurhalteassistent warnt sporadisch.", "Die Vorderachse wurde laut Protokoll exakt auf Sollwerte eingestellt – bezogen auf die Fahrzeuglängsmittelebene. Die Hinterachse wurde nicht vermessen."], "table": {"head": ["Achsvermessung Hinterachse (jetzt)", "Ist links", "Ist rechts", "Sollwert"], "rows": [["Einzelspur", "+0°18'", "−0°02'", "+0°08' ± 0°05'"], ["Sturz", "−1°30'", "−1°25'", "−1°30' ± 0°20'"]]}}, {"id": "B", "title": "Kundenauftrag B · Bremse und Fahrdynamik", "scene": "brake", "story": ["Ein Hybridfahrzeug mit ESP und elektromechanischer Parkbremse (EPB) kommt zur Bremsenprüfung. Die Kundin spürt beim Bremsen aus hoher Geschwindigkeit ein Pulsieren im Pedal und Lenkrad.", "Auf dem Rollenbremsprüfstand misst du an der Vorderachse links 2,6 kN und rechts 1,8 kN Bremskraft."]}, {"id": "C", "title": "Kundenauftrag C · Hochvolt", "scene": "hv", "story": ["Ein Elektrofahrzeug ist nicht fahrbereit. Im Fehlerspeicher des Batteriemanagements steht „Vorladung – Zeitüberschreitung“. Die Zwischenkreisspannung bleibt beim Einschalten bei 0 V.", "Abb. 1 zeigt den inneren Aufbau der HV-Batterie mit Schützen und den Anschluss an die Leistungselektronik."], "fig": "f_hvs", "figcap": "Abb. 1: HV-Batterie mit Schützen, Zwischenkreis und Pulswechselrichter (vereinfacht)"}, {"id": "D", "title": "Kundenauftrag D · Getriebe und Antriebsstrang", "scene": "gears", "story": ["Ein Allradfahrzeug mit Doppelkupplungsgetriebe und Lamellenkupplung zur Hinterachse kommt mit einem Heulgeräusch, das nur beim Beschleunigen (Zug) auftritt und im Schiebebetrieb verschwindet.", "Der Kunde hat kürzlich nur an der Vorderachse neue Reifen montieren lassen. Abb. 2 zeigt den Achsantrieb mit Ausgleichsgetriebe."]}], "items": [{"id": "A1", "sec": "A", "type": "mc", "pts": 3, "prompt": "Warum steht das Lenkrad schief, obwohl die Vorderachse auf Sollwerte eingestellt wurde?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Die Spurstangen wurden zu fest angezogen."}, {"id": "o1", "t": "Die Hinterachse hat unterschiedliche Einzelspurwerte. Dadurch weicht die geometrische Fahrachse von der Fahrzeuglängsmittelebene ab; das Fahrzeug läuft schräg und der Fahrer gleicht mit dem Lenkrad aus."}, {"id": "o2", "t": "Der Sturz an der Hinterachse ist außerhalb der Toleranz."}, {"id": "o3", "t": "Der Lenkwinkelsensor wurde nicht angelernt; mechanisch ist alles in Ordnung."}, {"id": "o4", "t": "Die Reifen sind an der Vorderachse unterschiedlich abgefahren."}]}, {"id": "A2", "sec": "A", "type": "tf", "pts": 4, "prompt": "Aussagen zur Achsvermessung in diesem Fall. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Zuerst muss die Hinterachse auf Sollwerte eingestellt werden."}, {"id": "s1", "t": "Danach wird die Vorderachse zur geometrischen Fahrachse eingestellt."}, {"id": "s2", "t": "Die Gesamtspur der Hinterachse liegt mit +0°16' innerhalb der Toleranz, deshalb ist dort nichts zu tun."}, {"id": "s3", "t": "Nach der Einstellung müssen Frontkamera bzw. Radar nach Herstellervorgabe kalibriert werden."}]}, {"id": "A3", "sec": "A", "type": "cloze", "pts": 5, "prompt": "Vervollständige den Text zur Lenkgeometrie.", "fig": null, "figcap": null, "table": null, "parts": ["Bei Kurvenfahrt muss das kurveninnere Rad ", {"g": "g0"}, " eingeschlagen werden als das kurvenäußere. Das bewirkt das ", {"g": "g1"}, ". Geprüft wird es über den ", {"g": "g2"}, ". Ein negativer Lenkrollhalbmesser ", {"g": "g3"}, " das Fahrzeug beim Bremsen auf Fahrbahnen mit unterschiedlicher Griffigkeit. Der Nachlauf erzeugt ein ", {"g": "g4"}, "."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "stärker"}, {"id": "c1", "t": "schwächer"}, {"id": "c2", "t": "gleich stark"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "Lenktrapez"}, {"id": "c1", "t": "Lenkgetriebe"}, {"id": "c2", "t": "Lenkdämpfer"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "Spurdifferenzwinkel"}, {"id": "c1", "t": "Sturz"}, {"id": "c2", "t": "Fahrachswinkel"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "stabilisiert"}, {"id": "c1", "t": "destabilisiert"}, {"id": "c2", "t": "beeinflusst nicht"}]}, {"id": "g4", "choices": [{"id": "c0", "t": "Rückstellmoment"}, {"id": "c1", "t": "Kippmoment"}, {"id": "c2", "t": "Bremsmoment"}]}]}, {"id": "A4", "sec": "A", "type": "multi", "pts": 3, "prompt": "Was ist beim Reifenwechsel an einem Fahrzeug mit direktem Reifendruck-Kontrollsystem zu beachten?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Sensoren vor der Demontage mit einem RDKS-Tool auslesen und prüfen"}, {"id": "o1", "t": "Ventil-Servicekit (Ventileinsatz, Dichtungen, Mutter) nach Herstellervorgabe erneuern"}, {"id": "o2", "t": "Sensoren nach Vorgabe am Fahrzeug anlernen bzw. auf neue Räder übertragen"}, {"id": "o3", "t": "Montierkopf beim Abdrücken direkt neben dem Ventil ansetzen"}, {"id": "o4", "t": "Winterräder ohne Sensoren sind bei Fahrzeugen mit direktem RDKS problemlos zulässig"}]}, {"id": "A5", "sec": "A", "type": "order", "pts": 6, "prompt": "Federbein (McPherson) erneuern: Bringe die Schritte in eine sinnvolle Reihenfolge (oben = zuerst).", "fig": null, "figcap": null, "table": null, "steps": [{"id": "p0", "t": "Fahrzeug anheben, Rad abbauen, Leitungen und Halter am Federbein lösen"}, {"id": "p1", "t": "Koppelstange und Verbindung zum Achsschenkel lösen, Federbein ausbauen"}, {"id": "p2", "t": "Feder mit geeignetem Federspanner vorspannen und Kolbenstangenmutter lösen"}, {"id": "p3", "t": "Teile auf das neue Federbein übertragen und Feder kontrolliert entspannen"}, {"id": "p4", "t": "Federbein einbauen; Gummilager-Verschraubungen in Konstruktionslage anziehen"}, {"id": "p5", "t": "Achsvermessung durchführen"}]}, {"id": "A6", "sec": "A", "type": "mc", "pts": 2, "prompt": "Warum werden Gummilager-Verschraubungen in Konstruktionslage (eingefedert) angezogen?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Damit die Schrauben leichter erreichbar sind."}, {"id": "o1", "t": "Weil sonst das Lager in Normallage verdreht ist: Es verspannt, verschleißt früher und kann Fahrhöhe sowie Fahrverhalten verändern."}, {"id": "o2", "t": "Weil das Drehmoment sonst nicht erreicht wird."}, {"id": "o3", "t": "Damit die Bremsleitungen nicht abreißen."}, {"id": "o4", "t": "Weil die Achsvermessung sonst nicht möglich ist."}]}, {"id": "A7", "sec": "A", "type": "tf", "pts": 4, "prompt": "Ordne jedem Reifenbild die wahrscheinlichste Ursache zu.", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Auswaschungen (Ausbrüche) in Abständen am Umfang der Lauffläche"}, {"id": "s1", "t": "Starker Verschleiß an beiden Schultern, Mitte kaum"}, {"id": "s2", "t": "Einseitiger Schulterverschleiß mit Gratbildung quer zum Profil"}, {"id": "s3", "t": "Lenkradflattern bei 100 bis 120 km/h ohne auffälliges Reifenbild"}], "labels": ["Fülldruck zu niedrig", "Spur falsch", "Unwucht", "Stoßdämpfer"]}, {"id": "A8", "sec": "A", "type": "mc", "pts": 2, "prompt": "Nach Abklemmen der Batterie meldet die elektromechanische Lenkung einen Fehler, die Unterstützung ist reduziert. Was ist am wahrscheinlichsten zu tun?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Die Lenkung erneuern."}, {"id": "o1", "t": "Lenkwinkelsensor bzw. Lenkanschläge nach Herstellervorgabe neu anlernen (Grundeinstellung)."}, {"id": "o2", "t": "Hydrauliköl nachfüllen."}, {"id": "o3", "t": "Die Spurstangen nachstellen."}, {"id": "o4", "t": "Die Batterie ersetzen."}]}, {"id": "A9", "sec": "A", "type": "multi", "pts": 3, "prompt": "Nach welchen Arbeiten ist eine Kalibrierung der Frontkamera in der Regel erforderlich?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Windschutzscheibe erneuert"}, {"id": "o1", "t": "Spur an der Hinterachse verändert (Fahrachse geändert)"}, {"id": "o2", "t": "Kamera aus- und wieder eingebaut"}, {"id": "o3", "t": "Wechsel von Sommer- auf Winterräder gleicher Größe"}, {"id": "o4", "t": "Ölwechsel"}]}, {"id": "B1", "sec": "B", "type": "num", "pts": 3, "prompt": "Berechne die Bremskraftdifferenz an der Vorderachse in Prozent, bezogen auf den größeren Wert.", "fig": null, "figcap": null, "table": null, "unit": "%"}, {"id": "B2", "sec": "B", "type": "mc", "pts": 2, "prompt": "Welche Ursache erklärt die zu geringe Bremskraft rechts am ehesten?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Zu alte Bremsflüssigkeit."}, {"id": "o1", "t": "Verölte oder verglaste Beläge bzw. ein schwergängiger Kolben im Sattel rechts."}, {"id": "o2", "t": "Ein defekter Bremskraftverstärker."}, {"id": "o3", "t": "Ein undichter Hauptbremszylinder."}, {"id": "o4", "t": "Zu hoher Reifendruck links."}]}, {"id": "B3", "sec": "B", "type": "mc", "pts": 2, "prompt": "Wie gehst du beim Pulsieren in Pedal und Lenkrad vor?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Beläge erneuern; das Pulsieren kommt immer von den Belägen."}, {"id": "o1", "t": "Seitenschlag der Scheibe mit Messuhr und Dickenschwankung mit Mikrometer messen; Ursache (z. B. Rost an der Nabe) beseitigen und Scheiben achsweise erneuern."}, {"id": "o2", "t": "Bremsflüssigkeit wechseln."}, {"id": "o3", "t": "ABS-Steuergerät neu anlernen."}, {"id": "o4", "t": "Reifen auswuchten."}]}, {"id": "B4", "sec": "B", "type": "tf", "pts": 4, "prompt": "Aussagen zum ESP. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Der Gierratensensor misst die Drehung des Fahrzeugs um die Hochachse."}, {"id": "s1", "t": "Der Lenkwinkelsensor liefert dem ESP den Fahrerwunsch."}, {"id": "s2", "t": "Bei Untersteuern bremst das ESP vorrangig das kurvenäußere Vorderrad."}, {"id": "s3", "t": "Bei Übersteuern bremst das ESP vorrangig das kurvenäußere Vorderrad."}]}, {"id": "B5", "sec": "B", "type": "cloze", "pts": 4, "prompt": "Vervollständige den Text zur ABS-Regelung.", "fig": null, "figcap": null, "table": null, "parts": ["Neigt ein Rad zum Blockieren, schließt zuerst das ", {"g": "g0"}, "; der Druck wird gehalten. Reicht das nicht, öffnet das ", {"g": "g1"}, " und der Druck wird abgebaut. Die ", {"g": "g2"}, " fördert die Bremsflüssigkeit zurück. So bleibt das Rad im Bereich der größten ", {"g": "g3"}, " und das Fahrzeug bleibt lenkbar."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "Einlassventil"}, {"id": "c1", "t": "Auslassventil"}, {"id": "c2", "t": "Umschaltventil"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "Auslassventil"}, {"id": "c1", "t": "Einlassventil"}, {"id": "c2", "t": "Entlüfterventil"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "Rückförderpumpe"}, {"id": "c1", "t": "Vakuumpumpe"}, {"id": "c2", "t": "Kraftstoffpumpe"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "Haftreibung"}, {"id": "c1", "t": "Rollreibung"}, {"id": "c2", "t": "Gleitreibung"}]}]}, {"id": "B6", "sec": "B", "type": "order", "pts": 6, "prompt": "Beläge an der Hinterachse mit EPB erneuern: Bringe die Schritte in die richtige Reihenfolge (oben = zuerst).", "fig": null, "figcap": null, "table": null, "steps": [{"id": "p0", "t": "Fahrzeug gegen Wegrollen sichern"}, {"id": "p1", "t": "EPB mit dem Diagnosetester in Servicestellung fahren"}, {"id": "p2", "t": "Sattel abbauen, Beläge und ggf. Scheiben erneuern, Führungen reinigen"}, {"id": "p3", "t": "Sattel montieren"}, {"id": "p4", "t": "Servicestellung beenden und Grundeinstellung durchführen"}, {"id": "p5", "t": "Funktion prüfen und Probefahrt durchführen"}]}, {"id": "B7", "sec": "B", "type": "multi", "pts": 3, "prompt": "Was gilt für Bremsanlagen von Hybrid- und Elektrofahrzeugen mit Bremsenergierückgewinnung?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Ein Steuergerät verteilt die Bremswirkung zwischen E-Maschine und Reibbremse (Blending)"}, {"id": "o1", "t": "Manche Systeme bauen selbstständig Bremsdruck auf (z. B. beim Öffnen der Fahrertür); vor Arbeiten ist der Servicemodus zu aktivieren"}, {"id": "o2", "t": "Das Entlüften kann einen Diagnosetester erfordern"}, {"id": "o3", "t": "Die Reibbremse wird nicht mehr benötigt"}, {"id": "o4", "t": "Bremsflüssigkeit muss nie gewechselt werden"}]}, {"id": "B8", "sec": "B", "type": "tf", "pts": 4, "prompt": "Aussagen zum Bremsweg. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Verdoppelt sich die Geschwindigkeit, vervierfacht sich der Bremsweg (ohne Reaktionsweg)."}, {"id": "s1", "t": "Der Reaktionsweg wächst linear mit der Geschwindigkeit."}, {"id": "s2", "t": "ABS verkürzt auf Schotter und Neuschnee immer den Bremsweg."}, {"id": "s3", "t": "Mit ABS bleibt das Fahrzeug während einer Vollbremsung lenkbar."}]}, {"id": "C1", "sec": "C", "type": "match", "pts": 8, "prompt": "Ordne den Marken 1 bis 8 in Abb. 1 die Bauteile zu.", "fig": null, "figcap": null, "table": null, "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}, {"id": "m6", "label": "7"}, {"id": "m7", "label": "8"}], "choices": [{"id": "c0", "t": "Wartungsstecker (Service-Disconnect)"}, {"id": "c1", "t": "HV-Sicherung"}, {"id": "c2", "t": "Hauptschütz HV+"}, {"id": "c3", "t": "Vorladeschütz"}, {"id": "c4", "t": "Vorladewiderstand"}, {"id": "c5", "t": "Stromsensor"}, {"id": "c6", "t": "Hauptschütz HV−"}, {"id": "c7", "t": "Zwischenkreiskondensator"}, {"id": "c8", "t": "Isolationswächter"}, {"id": "c9", "t": "DC/DC-Wandler"}, {"id": "c10", "t": "Relais Klemme 15"}], "mlabel": "Marke"}, {"id": "C2", "sec": "C", "type": "order", "pts": 5, "prompt": "Bringe die Schritte beim Zuschalten der HV-Batterie in die richtige Reihenfolge (oben = zuerst).", "fig": null, "figcap": null, "table": null, "steps": [{"id": "p0", "t": "Batteriemanagement prüft Isolation und Plausibilität der Spannungen"}, {"id": "p1", "t": "Hauptschütz HV− schließt"}, {"id": "p2", "t": "Vorladeschütz schließt, der Zwischenkreis lädt über den Vorladewiderstand"}, {"id": "p3", "t": "Zwischenkreisspannung erreicht annähernd die Batteriespannung"}, {"id": "p4", "t": "Hauptschütz HV+ schließt, danach öffnet das Vorladeschütz"}]}, {"id": "C3", "sec": "C", "type": "mc", "pts": 3, "prompt": "Warum wird der Zwischenkreis vorgeladen?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Damit die HV-Batterie schneller voll wird."}, {"id": "o1", "t": "Ohne Vorladung würde beim Schließen ein sehr hoher Strom in den leeren Kondensator fließen; Schützkontakte könnten verschweißen und Bauteile überlastet werden."}, {"id": "o2", "t": "Damit die 12-V-Batterie geladen wird."}, {"id": "o3", "t": "Um den Isolationswiderstand zu messen."}, {"id": "o4", "t": "Damit die E-Maschine vorgewärmt wird."}]}, {"id": "C4", "sec": "C", "type": "mc", "pts": 3, "prompt": "Die Zwischenkreisspannung bleibt beim Zuschalten bei 0 V, das BMS meldet „Vorladung – Zeitüberschreitung“. Wo liegt der Fehler am wahrscheinlichsten?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Der Zwischenkreiskondensator hat einen Kurzschluss; die Spannung würde dann langsam steigen."}, {"id": "o1", "t": "Im Vorladepfad oder im HV−-Pfad: z. B. Vorladewiderstand unterbrochen, Vorladeschütz oder Hauptschütz HV− schließt nicht."}, {"id": "o2", "t": "Die E-Maschine ist defekt."}, {"id": "o3", "t": "Der Stromsensor zeigt einen zu hohen Strom."}, {"id": "o4", "t": "Die 12-V-Batterie ist überladen."}]}, {"id": "C5", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zu Schützen und Batteriemanagement. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Das BMS kann einen verschweißten Schützkontakt erkennen, indem es vor dem Schließen die Spannung hinter dem Schütz prüft."}, {"id": "s1", "t": "Bei einem Crash werden die Schütze geöffnet."}, {"id": "s2", "t": "Der Stromsensor wird für die Berechnung des Ladezustands genutzt."}, {"id": "s3", "t": "Das Ziehen des Wartungssteckers ersetzt das Feststellen der Spannungsfreiheit."}]}, {"id": "C6", "sec": "C", "type": "multi", "pts": 3, "prompt": "Wie wird die Spannungsfreiheit am HV-System richtig festgestellt?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Mit einem zweipoligen Spannungsprüfer der passenden Messkategorie"}, {"id": "o1", "t": "Messung HV+ gegen HV−, HV+ gegen Masse und HV− gegen Masse"}, {"id": "o2", "t": "Den Prüfer vor und nach der Messung an einer bekannten Spannungsquelle prüfen"}, {"id": "o3", "t": "Eine Messung HV+ gegen Masse genügt"}, {"id": "o4", "t": "Die Spannungsanzeige im Kombiinstrument ablesen"}]}, {"id": "C7", "sec": "C", "type": "tf", "pts": 4, "prompt": "Ordne jeder Tätigkeit die mindestens erforderliche Qualifikationsstufe nach DGUV Information 209-093 zu.", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Fahrzeug in die Waschanlage fahren"}, {"id": "s1", "t": "Räder wechseln am HV-Fahrzeug"}, {"id": "s2", "t": "HV-System freischalten und den Klimakompressor ersetzen"}, {"id": "s3", "t": "Arbeiten an Zellmodulen einer unter Spannung stehenden HV-Batterie"}], "labels": ["S", "1S", "2S", "3S"]}, {"id": "C8", "sec": "C", "type": "cloze", "pts": 4, "prompt": "Vervollständige den Text zur Isolationsüberwachung.", "fig": null, "figcap": null, "table": null, "parts": ["Das HV-Bordnetz ist gegenüber der Fahrzeugmasse isoliert aufgebaut (ungeerdetes System). Ein einzelner Isolationsfehler führt deshalb ", {"g": "g0"}, " zu einem gefährlichen Körperstrom. Der ", {"g": "g1"}, " erkennt ihn und meldet ihn. Gefährlich wird es bei einem ", {"g": "g2"}, " Isolationsfehler am anderen Pol. Damit berührbare Gehäuse dabei kein unterschiedliches Potenzial haben, sind sie über den ", {"g": "g3"}, " verbunden."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "nicht unmittelbar"}, {"id": "c1", "t": "sofort"}, {"id": "c2", "t": "immer"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "Isolationswächter"}, {"id": "c1", "t": "Stromsensor"}, {"id": "c2", "t": "Vorladewiderstand"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "zweiten"}, {"id": "c1", "t": "ersten"}, {"id": "c2", "t": "dauerhaften"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "Potentialausgleich"}, {"id": "c1", "t": "Wartungsstecker"}, {"id": "c2", "t": "CAN-Bus"}]}]}, {"id": "C9", "sec": "C", "type": "mc", "pts": 2, "prompt": "Warum besitzen HV-Batterien ein aufwendiges Thermomanagement (Kühlen und Heizen)?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Weil die Zellen nur im Winter arbeiten."}, {"id": "o1", "t": "Weil Lebensdauer, Ladeleistung und verfügbare Leistung der Zellen stark von der Temperatur abhängen."}, {"id": "o2", "t": "Damit der Innenraum schneller warm wird."}, {"id": "o3", "t": "Weil die Zellen sonst ihre Spannung verdoppeln."}, {"id": "o4", "t": "Damit der Isolationswiderstand sinkt."}]}, {"id": "C10", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zum Laden. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Über den Proximity-Kontakt (PP) erkennt das Fahrzeug die Strombelastbarkeit des Ladekabels."}, {"id": "s1", "t": "Beim AC-Laden teilt die Ladestation dem Fahrzeug über das Pilotsignal (CP) den maximal zulässigen Ladestrom mit."}, {"id": "s2", "t": "Beim DC-Laden fließt der Strom über den On-Board-Lader."}, {"id": "s3", "t": "Das Fahrzeug darf beim Laden mehr Strom aufnehmen, als die Ladestation über das Pilotsignal freigibt."}]}, {"id": "D1", "sec": "D", "type": "match", "pts": 6, "prompt": "Ordne den Marken 1 bis 6 in Abb. 2 die Bauteile zu.", "fig": "f_diff", "figcap": "Abb. 2: Achsantrieb mit Kegelrad-Ausgleichsgetriebe (Schnitt, vereinfacht)", "table": null, "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}], "choices": [{"id": "c0", "t": "Antriebskegelrad"}, {"id": "c1", "t": "Tellerrad"}, {"id": "c2", "t": "Ausgleichskegelrad"}, {"id": "c3", "t": "Achswellenkegelrad"}, {"id": "c4", "t": "Ausgleichsgehäuse"}, {"id": "c5", "t": "Ausgleichsbolzen"}, {"id": "c6", "t": "Sonnenrad"}, {"id": "c7", "t": "Hohlrad"}, {"id": "c8", "t": "Lamellenpaket"}], "mlabel": "Marke"}, {"id": "D2", "sec": "D", "type": "tf", "pts": 4, "prompt": "Aussagen zum Ausgleichsgetriebe. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Steht das Ausgleichsgehäuse still und dreht ein Rad vorwärts, dreht das andere gleich schnell rückwärts."}, {"id": "s1", "t": "Bei Geradeausfahrt drehen sich die Ausgleichskegelräder ständig um ihren Bolzen."}, {"id": "s2", "t": "Hypoidverzahnungen benötigen wegen hoher Gleitanteile spezielles Hypoidöl."}, {"id": "s3", "t": "Ein offenes Ausgleichsgetriebe verteilt das Antriebsmoment zu gleichen Teilen auf beide Räder."}]}, {"id": "D3", "sec": "D", "type": "num", "pts": 2, "prompt": "Das Ausgleichsgehäuse dreht mit 500 1/min, das linke Rad mit 560 1/min. Wie schnell dreht das rechte Rad?", "fig": null, "figcap": null, "table": null, "unit": "1/min"}, {"id": "D4", "sec": "D", "type": "mc", "pts": 2, "prompt": "Ein Heulgeräusch tritt nur unter Zug auf und verschwindet im Schiebebetrieb. Was ist die wahrscheinlichste Ursache?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Ein defektes Radlager."}, {"id": "o1", "t": "Fehlerhafter Zahneingriff (Tragbild, Zahnflankenspiel) zwischen Antriebskegelrad und Tellerrad oder verschlissene Lager im Achsantrieb."}, {"id": "o2", "t": "Ein loses Hitzeschutzblech."}, {"id": "o3", "t": "Zu hoher Reifendruck."}, {"id": "o4", "t": "Ein verschlissenes äußeres Gleichlaufgelenk."}]}, {"id": "D5", "sec": "D", "type": "mc", "pts": 2, "prompt": "Warum sollen bei diesem Allradfahrzeug Reifen gleicher Größe und ähnlicher Profiltiefe an allen Achsen montiert sein?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Damit das Fahrzeug optisch einheitlich aussieht."}, {"id": "o1", "t": "Unterschiedliche Abrollumfänge erzeugen eine dauernde Drehzahldifferenz zwischen den Achsen; die Lamellenkupplung arbeitet dann ständig mit Schlupf, überhitzt und verschleißt."}, {"id": "o2", "t": "Weil der Tacho sonst falsch anzeigt."}, {"id": "o3", "t": "Damit das Doppelkupplungsgetriebe schneller schaltet."}, {"id": "o4", "t": "Weil das ESP nur mit neuen Reifen arbeitet."}]}, {"id": "D6", "sec": "D", "type": "cloze", "pts": 5, "prompt": "Vervollständige den Text zum Doppelkupplungsgetriebe.", "fig": null, "figcap": null, "table": null, "parts": ["Kupplung K1 treibt das Teilgetriebe mit den ", {"g": "g0"}, " Gängen an, K2 das mit den geraden Gängen. Beim Hochschalten ", {"g": "g1"}, " K1, während K2 ", {"g": "g2"}, ". Gesteuert werden die Kupplungen von der ", {"g": "g3"}, ". Nasse Kupplungen werden durch ", {"g": "g4"}, " gekühlt."], "gaps": [{"id": "g0", "choices": [{"id": "c0", "t": "ungeraden"}, {"id": "c1", "t": "geraden"}, {"id": "c2", "t": "allen"}]}, {"id": "g1", "choices": [{"id": "c0", "t": "öffnet"}, {"id": "c1", "t": "schließt"}, {"id": "c2", "t": "blockiert"}]}, {"id": "g2", "choices": [{"id": "c0", "t": "schließt"}, {"id": "c1", "t": "öffnet"}, {"id": "c2", "t": "rutscht"}]}, {"id": "g3", "choices": [{"id": "c0", "t": "Mechatronik"}, {"id": "c1", "t": "Lambdasonde"}, {"id": "c2", "t": "Kardanwelle"}]}, {"id": "g4", "choices": [{"id": "c0", "t": "Öl"}, {"id": "c1", "t": "Luft"}, {"id": "c2", "t": "Kühlwasser"}]}]}, {"id": "D7", "sec": "D", "type": "order", "pts": 5, "prompt": "Bringe die Vorgänge beim Schalten mit Sperrsynchronisierung in die richtige Reihenfolge (oben = zuerst).", "fig": null, "figcap": null, "table": null, "steps": [{"id": "p0", "t": "Die Schaltmuffe drückt den Synchronring gegen den Reibkonus des Gangrads"}, {"id": "p1", "t": "Die Reibung gleicht die Drehzahlen an; die Sperrverzahnung verhindert das Durchschalten"}, {"id": "p2", "t": "Gleichlauf ist erreicht, der Synchronring gibt die Schaltmuffe frei"}, {"id": "p3", "t": "Die Schaltmuffe spurt in die Kupplungsverzahnung des Gangrads ein"}, {"id": "p4", "t": "Der Gang ist formschlüssig geschaltet"}]}, {"id": "D8", "sec": "D", "type": "tf", "pts": 5, "prompt": "Ordne jedes Merkmal der passenden Getriebebauart zu.", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Kegelscheiben mit Schubgliederband oder Kette"}, {"id": "s1", "t": "Hydrodynamischer Drehmomentwandler und Planetenradsätze"}, {"id": "s2", "t": "Zwei Teilgetriebe mit je einer Kupplung"}, {"id": "s3", "t": "Schaltmuffen mit Synchronringen, Fahrer betätigt die Trennkupplung"}, {"id": "s4", "t": "Stufenlose Änderung der Übersetzung"}], "labels": ["Schaltgetriebe", "Wandlerautomat", "DKG", "CVT"]}, {"id": "D9", "sec": "D", "type": "tf", "pts": 4, "prompt": "Aussagen zu Kupplung und Zweimassenschwungrad. Wahr oder falsch?", "fig": null, "figcap": null, "table": null, "statements": [{"id": "s0", "t": "Das Zweimassenschwungrad dämpft Drehschwingungen des Motors."}, {"id": "s1", "t": "Beim Kupplungswechsel wird das Zweimassenschwungrad nach Herstellervorgabe auf Verdreh- und Kippspiel geprüft."}, {"id": "s2", "t": "Verölte Beläge oder defekte Motorlager können Rupfen beim Anfahren verursachen."}, {"id": "s3", "t": "Eine selbstnachstellende Kupplung darf ohne Spezialwerkzeug beliebig montiert werden."}]}, {"id": "D10", "sec": "D", "type": "multi", "pts": 3, "prompt": "Was ist beim Ölwechsel an einem Automatikgetriebe zu beachten?", "fig": null, "figcap": null, "table": null, "options": [{"id": "o0", "t": "Nur das vom Hersteller freigegebene Öl verwenden"}, {"id": "o1", "t": "Ölstand bei der vorgeschriebenen Öltemperatur   let owner = false; try { owner = USER ? !!(await USER.isOwner()) : false; } catch (e) {}
  if (owner) { const b = document.getElementById("teacherBtn"); b.classList.remove("hide"); b.addEventListener("click", renderTeacher); }
  if (DB && UID && !owner && !CONFIG.ALLOW_RETRY && S.phase === "start") {
    try {
      const snap = await DB.doc("results/" + UID).get();
      if (snap.exists) { const d = snap.data(); S = { phase: "done", name: d.name, klasse: d.klasse, startedAt: 0, layout: {}, answers: d.answers || {}, touched: {},
        result: { got: d.got, max: d.max, pct: d.pct, per: d.per, sec: d.sec, at: d.at, auto: d.auto, minutes: d.minutes } }; save(); renderResult(); }
    } catch (e) {}
  }
  if (S.phase === "done" && S.result) sendResult();
}

// ---------- Ansicht Lehrkraft ----------
let unsub = null;
function renderTeacher() {
  chrome("teacher"); app.replaceChildren(); window.scrollTo(0, 0);
  const body = el("tbody"); const status = el("p", { class: "note", text: "Ergebnisse werden geladen …" });
  app.append(el("section", { class: "card" },
    el("div", { class: "eyebrow", text: "Lehrkraft" }), el("h2", { style: "font-size:26px;margin:4px 0 8px", text: "Abgaben" }),
    el("p", { class: "note", text: "Nur Abgaben von angemeldeten Teilnehmenden mit Mitwirkungsrecht werden hier gespeichert. Alle anderen zeigen dir ihr Ergebnis auf dem Bildschirm." }),
    status,
    el("div", { class: "tw" }, el("table", null, el("thead", null, el("tr", null, ["Name", "Klasse", "Punkte", "%", ...SEC.map(s => s.id), "Zeit", "abgegeben"].map(h => el("th", { text: h })))), body)),
    el("div", { class: "row", style: "margin-top:12px" },
      el("button", { class: "btn ghost", type: "button", text: "Musterlösung ansehen", onclick: () => { app.querySelectorAll(".sec,.item").forEach(n => n.remove()); renderReview(null, null); } }),
      el("button", { class: "btn ghost", type: "button", text: "Zurück zum Test", onclick: () => { if (unsub) unsub(); S.phase === "test" ? renderTest() : S.phase === "done" ? renderResult() : renderStart(); } }))));
  if (!DB) { status.textContent = "Ergebnisspeicher ist in dieser Ansicht nicht verfügbar."; return; }
  const timer = setTimeout(() => { status.textContent = "Die Ergebnisse sind gerade nicht erreichbar."; }, 10000);
  if (unsub) unsub();
  unsub = DB.collection("results").orderBy("at", "desc").onSnapshot(snap => {
    clearTimeout(timer);
    status.textContent = snap.empty ? "Noch keine Abgaben gespeichert." : `${snap.size} Abgaben · Schnitt ${fmt(snap.docs.reduce((s, d) => s + (d.data().pct || 0), 0) / snap.size)} %`;
    body.replaceChildren(...snap.docs.map(d => { const x = d.data();
      return el("tr", null, el("td", { text: x.name || "?" }), el("td", { text: x.klasse || "" }), el("td", { class: "num", text: `${x.got}/${x.max}` }),
        el("td", { class: "num", text: fmt(x.pct) }), ...SEC.map(s => el("td", { class: "num", text: x.sec && x.sec[s.id] ? `${x.sec[s.id].got}/${x.sec[s.id].max}` : "" })),
        el("td", { class: "num", text: (x.minutes ?? "") + " min" }), el("td", { text: x.at ? new Date(x.at).toLocaleString("de-DE") : "" })); }));
  }, () => { clearTimeout(timer); status.textContent = "Die Ergebnisse konnten nicht geladen werden."; });
}

// ---------- Start ----------
if (S.phase === "test") { if (!S.layout || !Object.keys(S.layout).length) S.layout = makeLayout(); renderTest(); }
else if (S.phase === "done" && S.result) renderResult();
else renderStart();

</script>

<script>
// Ergebnisübermittlung an das Google-Formular und Freischaltung weiterer Versuche durch die Lehrkraft.
(function () {
  var ZIEL = "https://docs.google.com/forms/d/e/1FAIpQLScqqprIbaerhmgaWx6lF_CiJUVyXleFBCMea8aTlpB8xhh9jw/formResponse";
  var F = {"name": "entry.1310728237", "klasse": "entry.1103803953", "teil": "entry.741955321", "punkte": "entry.1144687010", "prozent": "entry.141246579", "note": "entry.1182933868", "details": "entry.1853769831"};
  var TEIL = "Teil 2";
  var CODE_HASH = "9d86f193bc7f3095c687e7c5865557cfe620345b68b1e6059ac66ed0d0dc53d5";
  function hinweis(t) { var n = document.getElementById("sendState"); if (n) n.textContent = t; }
  function senden() {
    if (typeof S === "undefined" || !S || !S.result || S.sent) return;
    var r = S.result;
    var teile = SEC.map(function (s) { return s.id + " " + r.sec[s.id].got + "/" + r.sec[s.id].max; }).join(" · ");
    var p = new URLSearchParams();
    p.append(F.name, S.name || "");
    p.append(F.klasse, S.klasse || "");
    p.append(F.punkte, r.got + "/" + r.max);
    p.append(F.prozent, String(r.pct).replace(".", ","));
    if (F.teil) p.append(F.teil, TEIL);
    if (F.note) p.append(F.note, String(r.note || noteOf(r.pct)));
    p.append(F.details, (F.teil ? "" : TEIL + " · ") + "Note " + (r.note || noteOf(r.pct)) + " · " + teile + " · " + r.minutes + " min" + (r.auto ? " · automatisch abgegeben" : "") + (S.attempt > 1 ? " · Versuch " + S.attempt : "") + " · " + new Date(r.at).toLocaleString("de-DE"));
    fetch(ZIEL, { method: "POST", mode: "no-cors", body: p })
      .then(function () { S.sent = true; save(); hinweis("Ergebnis an die Lehrkraft übermittelt."); })
      .catch(function () { hinweis("Ergebnis konnte nicht übermittelt werden. Bitte zeig es deiner Lehrkraft."); });
  }
  async function codeStimmt(code) {
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ap-kfz:" + code));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("") === CODE_HASH;
  }
  function freischaltBereich() {
    var karte = document.querySelector("#app section.card");
    if (!karte || !S || S.phase !== "done") return;
    var box = el("div", { style: "margin-top:16px;border-top:1px solid var(--line);padding-top:10px" });
    var knopf = el("button", { type: "button", class: "tbtn", text: "Lehrkraft" });
    var form = el("div", { class: "row hide", style: "margin-top:8px;align-items:center" });
    var feld = el("input", { type: "password", inputmode: "numeric", autocomplete: "off", id: "lkcode", "aria-label": "Code der Lehrkraft", placeholder: "Code",
      style: "border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;width:130px" });
    var ok = el("button", { type: "button", class: "btn", text: "Neuen Versuch freischalten" });
    var meldung = el("p", { class: "note" });
    knopf.addEventListener("click", function () { form.classList.toggle("hide"); feld.focus(); });
    async function freischalten() {
      if (await codeStimmt(feld.value.trim())) {
        var n = (S.attempt || 1) + 1;
        S = { phase: "start", name: S.name, klasse: S.klasse, startedAt: 0, layout: {}, answers: {}, touched: {}, result: null, sent: false, attempt: n };
        save();
        renderStart("Versuch " + n + " ist freigeschaltet. Starte, wenn du bereit bist.");
      } else { meldung.textContent = "Code falsch."; feld.value = ""; feld.focus(); }
    }
    ok.addEventListener("click", freischalten);
    feld.addEventListener("keydown", function (e) { if (e.key === "Enter") freischalten(); });
    form.append(feld, ok); box.append(knopf, form, meldung); karte.append(box);
  }
  var abgeben = window.submit;
  window.submit = function (auto) { var x = abgeben(auto); senden(); return x; };
  var zeigen = window.renderResult;
  window.renderResult = function () { var x = zeigen.apply(this, arguments); freischaltBereich(); return x; };
  if (S && S.phase === "done" && S.result) window.renderResult();
  senden();
})();
</script>
