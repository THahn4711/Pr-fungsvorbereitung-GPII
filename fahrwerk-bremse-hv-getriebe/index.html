<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probeprüfung Fahrwerk Bremse HV Getriebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine ruhige Prüfungsspalte, Kopfzeile mit Name, Zeit und Fortschritt fest oben, Abgabe fest unten. */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#1d2733; --muted:#5b6775; --line:#d6dce3;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-ink:#ffffff;
  --good:#2e7d4f; --good-soft:#e5f3ea; --bad:#b3261e; --bad-soft:#fbe9e7; --warn:#8a5a00;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#12171d; --card:#1b222b; --ink:#e4e9ef; --muted:#9aa6b3; --line:#2f3a46;
  --accent:#7fb0e0; --accent-soft:#1f3346; --accent-ink:#0d1620;
  --good:#6cc28f; --good-soft:#173325; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e0b25c; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:18px;flex:1 1 260px}
.bar .meta{display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted);flex-wrap:wrap}
.pill{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:14px}
.pill.warn{background:var(--bad-soft);color:var(--bad)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
main{max-width:880px;margin:0 auto;padding:20px 16px 120px;display:flex;flex-direction:column;gap:18px}
.card{scroll-margin-top:84px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.lead{max-width:65ch}
.muted{color:var(--muted)}
.sec{border-left:5px solid var(--accent)}
.sec h2{font-size:24px;margin:4px 0 10px}
.story p{margin:0 0 8px;max-width:65ch}
.story p.quote{font-style:italic}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
figure{margin:12px 0 4px}
figure .plate{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
figure img{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.item{display:flex;flex-direction:column;gap:12px}
.ihead{display:flex;gap:12px;align-items:flex-start}
.inr{flex:none;font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:2px 8px;min-width:44px;text-align:center}
.iprompt{flex:1;max-width:65ch}
.ipts{flex:none;font-family:var(--mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.kind{font-size:12px;font-family:var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tf{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.tf .st{padding:8px 0;border-bottom:1px solid var(--line)}
.tf .ch{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:6px 0}
.seg{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;cursor:pointer;min-width:74px}
.seg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:4px 0}
.mlab{font-family:var(--display);font-weight:600}
.mlab b{display:inline-grid;place-items:center;min-width:28px;height:28px;border:2px solid var(--ink);border-radius:999px;font-family:var(--mono);font-size:14px;margin-left:4px;padding:0 6px}
select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 10px;width:100%;max-width:520px}
.numin{display:flex;gap:10px;align-items:center}
.numin input{width:160px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.numin .unit{font-family:var(--mono)}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ord .pos{font-family:var(--mono);color:var(--muted);width:22px;text-align:right;flex:none}
.ord .tx{flex:1}
.ord button{border:1px solid var(--line);background:var(--card);border-radius:6px;width:36px;height:32px;cursor:pointer}
.ord button:disabled{opacity:.35;cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20}
.foot-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
.field input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:9px 11px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
ul.rules{margin:8px 0 0;padding-left:20px;max-width:65ch}
ul.rules li{margin:3px 0}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .card{max-width:480px;width:100%}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.secbars{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sb{display:grid;grid-template-columns:minmax(150px,260px) 1fr 90px;gap:10px;align-items:center;font-size:15px}
.sb .track{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.sb .track i{display:block;height:100%;background:var(--accent)}
.sb .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rv{border-top:1px solid var(--line);padding-top:12px}
.mark{font-family:var(--mono);font-size:13px;border-radius:999px;padding:1px 8px}
.mark.ok{background:var(--good-soft);color:var(--good)}
.mark.no{background:var(--bad-soft);color:var(--bad)}
.rl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.rl li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.rl .ic{font-weight:700;text-align:center}
.rl .ic.ok{color:var(--good)} .rl .ic.no{color:var(--bad)}
.expl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15px;max-width:72ch}
.hide{display:none!important}
.note{font-size:14px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
/* Szenen: Instrumententafel und Animationen in einer eigenen, dunklen Bildwelt */
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.scene{background:#0d1217;border-radius:10px;padding:10px 10px 8px;color:#c9d3de;border:1px solid #1f2933}
.scene svg,.scene canvas{display:block;width:100%;height:auto}
.scene .cap{font-size:13px;color:#93a3b4;margin:6px 4px 0;display:flex;gap:8px;align-items:center}
.scene .cap::before{content:"";width:7px;height:7px;border-radius:50%;background:#e5484d;flex:none;animation:rec 1.6s infinite}
.scene-wide{margin-top:14px}
.scenes-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px}
@keyframes rec{50%{opacity:.25}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.08}}
@keyframes idle{0%{transform:rotate(-106deg)}18%{transform:rotate(-99deg)}31%{transform:rotate(-111deg)}52%{transform:rotate(-101deg)}68%{transform:rotate(-113deg)}84%{transform:rotate(-100deg)}100%{transform:rotate(-106deg)}}
@keyframes rise{0%{transform:rotate(-8deg)}62%{transform:rotate(116deg)}100%{transform:rotate(116deg)}}
@keyframes lampLate{0%,58%{opacity:.08}60%,100%{opacity:1}}
@keyframes msgLate{0%,58%{opacity:0}62%,100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cycle3{0%,30%{opacity:1}33%,100%{opacity:0}}
.n-idle{animation:idle 2.2s ease-in-out infinite}
.n-rise{animation:rise 9s ease-in infinite}
.l-blink{animation:blink 1s steps(1) infinite}
.l-late{animation:lampLate 9s linear infinite}
.m-late{animation:msgLate 9s linear infinite}
.fan{animation:spin 2.8s linear infinite}
.cy{opacity:0;animation:cycle3 7.5s infinite}
.cy.c2{animation-delay:2.5s}.cy.c3{animation-delay:5s}
.secnav{display:flex;gap:6px}
.secnav button{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer}
.secnav button.full{background:var(--good-soft);color:var(--good);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:center}
@keyframes roadmove{to{transform:translateY(40px)}}
@keyframes drift{0%,8%{transform:translateX(0) rotate(0)}70%,88%{transform:translateX(64px) rotate(7deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes glow{0%{opacity:.35}100%{opacity:1}}
.road{animation:roadmove .7s linear infinite}
.drift{animation:drift 6s ease-in-out infinite}
.disc{animation:spin 1.1s linear infinite}
.glow{animation:glow 1.8s ease-in-out infinite alternate}
.g1{animation:spin 2.4s linear infinite}
.g2{animation:spin 7s linear infinite reverse}
@media (max-width:760px){.sec-grid,.hero,.scenes-2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}.cy.c1{opacity:1}.l-late,.m-late{opacity:1}}
@media (max-width:560px){.mrow{grid-template-columns:1fr}.sb{grid-template-columns:1fr 70px}.sb .track{grid-column:1/-1;order:3}.big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1>Probeprüfung Fahrwerk · Bremse · Hochvolt · Getriebe</h1>
  <div class="meta">
    <span id="who" class="hide"></span>
    <nav class="secnav hide" id="secnav" aria-label="Kundenaufträge"></nav>
    <span id="answered" class="pill hide" title="beantwortete Aufgaben">0 / 0</span>

</div><div class="prog"><i id="progbar"></i></div></div>

<main id="app"></main>

<div class="foot hide" id="foot"><div class="foot-in">

</div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="card">

  </div>
</div></div>

<script>
const BUNDLE = {"sections": [{"id": "A", "title": "Kundenauftrag A · Fahrwerk", "story": ["Ein Kompaktwagen (Reifen 225/45 R17 94 W) kommt nach einem Bordsteinkontakt vorne rechts in die Werkstatt.", "Der Kunde berichtet: „Das Auto zieht nach rechts, obwohl das Lenkrad gerade steht. Der rechte Vorderreifen ist außen stärker abgefahren.“"], "table": {"head": ["Achsvermessung Vorderachse", "Ist links", "Ist rechts", "Sollwert"], "rows": [["Sturz", "−1°25'", "−0°05'", "−1°20' ± 0°30'"], ["Nachlauf", "7°10'", "7°05'", "7°15' ± 0°30'"], ["Einzelspur", "+0°05'", "+0°05'", "+0°05' ± 0°05'"]]}}, {"id": "B", "title": "Kundenauftrag B · Bremse", "story": ["Eine Kundin kommt nach einer langen Passabfahrt in die Werkstatt. Die Bremsflüssigkeit wurde seit vier Jahren nicht gewechselt.", "„Das Bremspedal war am Ende der Abfahrt ganz weich und ließ sich weit durchtreten. Außerdem leuchtet manchmal die ABS-Kontrollleuchte.“"], "fig": "f2", "figcap": "Abb. 2: Hydraulische Zweikreis-Bremsanlage mit ABS/ESP (vereinfacht)", "table": {"head": ["Prüfung", "Ergebnis"], "rows": [["Siedepunkt der Bremsflüssigkeit (DOT 4)", "148 °C"], ["Dicke Bremsscheibe vorne links (Mindestdicke 21,0 mm)", "20,6 mm"], ["Fehlerspeicher ABS/ESP", "Raddrehzahlsensor hinten rechts – Signal unplausibel, sporadisch"]]}}, {"id": "C", "title": "Kundenauftrag C · Hochvolt", "story": ["Ein Elektrofahrzeug (Nennspannung des HV-Systems 400 V) wird abgeschleppt. Im Display stand „Antriebssystem gestört – Isolationsfehler“.", "Der Auftrag lautet: Fehler eingrenzen und den elektrischen Klimakompressor prüfen. Du arbeitest mit Abb. 4."], "fig": "f4", "figcap": "Abb. 4: Hochvoltsystem eines Elektrofahrzeugs (vereinfacht)"}, {"id": "D", "title": "Kundenauftrag D · Getriebe", "story": ["Ein Kunde möchte vor dem Kauf eines Gebrauchtwagens mit Doppelkupplungsgetriebe wissen, worauf er achten muss. Sein jetziges Fahrzeug hat ein Schaltgetriebe.", "„Mein Schaltwagen ruckelt nicht, aber im 2. Gang dreht der Motor bei 50 km/h schon ziemlich hoch. Warum eigentlich?“ Du nutzt die Getriebedaten in der Tabelle."], "table": {"head": ["Getriebedaten Schaltgetriebe", "Wert"], "rows": [["2. Gang: Zähnezahl Antriebsrad / Abtriebsrad", "12 / 35"], ["Achsantrieb: Übersetzung", "3,65"], ["Motordrehzahl in der Betrachtung", "3 000 1/min"]]}}], "items": [{"id": "A1", "sec": "A", "type": "match", "pts": 5, "prompt": "Ordne den Marken 1 bis 5 in Abb. 1 die Fahrwerksgrößen zu.", "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}], "choices": [{"id": "c0", "t": "Sturz"}, {"id": "c1", "t": "Spreizung"}, {"id": "c2", "t": "Lenkrollhalbmesser"}, {"id": "c3", "t": "Nachlaufwinkel"}, {"id": "c4", "t": "Nachlaufstrecke"}, {"id": "c5", "t": "Vorspur"}, {"id": "c6", "t": "Spurdifferenzwinkel"}, {"id": "c7", "t": "Einpresstiefe"}], "fig": "f1", "figcap": "Abb. 1: Fahrwerksgeometrie der Vorderachse", "mlabel": "Marke"}, {"id": "A2", "sec": "A", "type": "mc", "pts": 2, "prompt": "Welche Ursache erklärt laut Achsvermessung, dass das Fahrzeug nach rechts zieht?", "options": [{"id": "o0", "t": "Die Einzelspur rechts liegt außerhalb der Toleranz."}, {"id": "o1", "t": "Der Sturz rechts ist deutlich positiver als links (Sturzdifferenz); das Fahrzeug zieht zur Seite mit dem positiveren Sturz."}, {"id": "o2", "t": "Der Nachlauf links ist zu groß."}, {"id": "o3", "t": "Die Reifen haben unterschiedliche Geschwindigkeitssymbole."}, {"id": "o4", "t": "Der Lenkrollhalbmesser ist negativ."}], "fig": null, "figcap": null, "table": null}, {"id": "A3", "sec": "A", "type": "tf", "pts": 4, "prompt": "Aussagen zu Achsgeometrie und Reifenverschleiß. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Positiver Nachlauf erzeugt ein Rückstellmoment und verbessert den Geradeauslauf."}, {"id": "s1", "t": "Zu große Vorspur führt zu verstärktem Verschleiß an der Reifeninnenschulter."}, {"id": "s2", "t": "Ein zu positiver Sturz verschleißt den Reifen bevorzugt an der Außenschulter."}, {"id": "s3", "t": "Ein Lenkradschiefstand wird bei der Spureinstellung über die Spurstangen korrigiert."}], "fig": null, "figcap": null, "table": null}, {"id": "A4", "sec": "A", "type": "order", "pts": 5, "prompt": "Bringe die Arbeitsschritte der Achsvermessung in eine sinnvolle Reihenfolge (oben = zuerst).", "steps": [{"id": "p0", "t": "Vorprüfung: Reifenfülldruck, Profil, Spiel in Lagern und Gelenken, Beladung nach Herstellervorgabe"}, {"id": "p1", "t": "Fahrzeug auf dem Messplatz ausrichten, Messwertaufnehmer montieren"}, {"id": "p2", "t": "Felgenschlagkompensation durchführen"}, {"id": "p3", "t": "Istwerte erfassen und mit den Sollwerten vergleichen"}, {"id": "p4", "t": "Defekte Teile ersetzen, einstellen und Protokoll ausdrucken"}]}, {"id": "A5", "sec": "A", "type": "num", "pts": 4, "prompt": "Berechne den Außendurchmesser des Reifens 225/45 R17 (ohne Einfederung).", "unit": "mm", "fig": null, "figcap": null, "table": null}, {"id": "A6", "sec": "A", "type": "tf", "pts": 4, "prompt": "Aussagen zur Reifenbezeichnung 225/45 R17 94 W. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Die 45 gibt das Verhältnis von Reifenhöhe zu Reifenbreite in Prozent an."}, {"id": "s1", "t": "Das R steht für Radialbauart."}, {"id": "s2", "t": "Die Tragfähigkeitskennzahl 94 bedeutet eine Tragfähigkeit von 94 kg je Reifen."}, {"id": "s3", "t": "Das Geschwindigkeitssymbol W steht für eine zulässige Höchstgeschwindigkeit von 270 km/h."}], "fig": null, "figcap": null, "table": null}, {"id": "A7", "sec": "A", "type": "mc", "pts": 2, "prompt": "Welche Auswirkung haben verschlissene Stoßdämpfer?", "options": [{"id": "o0", "t": "Der Reifenfülldruck steigt."}, {"id": "o1", "t": "Die Räder verlieren häufiger den Fahrbahnkontakt; Bremsweg und Kurvenstabilität verschlechtern sich."}, {"id": "o2", "t": "Die Federrate der Tragfedern sinkt."}, {"id": "o3", "t": "Der Nachlauf wird größer."}, {"id": "o4", "t": "Das Fahrzeug liegt dauerhaft tiefer."}], "fig": null, "figcap": null, "table": null}, {"id": "A8", "sec": "A", "type": "tf", "pts": 4, "prompt": "Aussagen zum Reifendruck-Kontrollsystem (RDKS). Wahr oder falsch?", "statements": [{"id": "s0", "t": "Direkte Systeme messen den Druck mit Sensoren im Rad und senden die Werte per Funk."}, {"id": "s1", "t": "Indirekte Systeme messen den Druck mit einem Drucksensor im Ventil."}, {"id": "s2", "t": "Bei indirekten Systemen muss nach einer Reifendruckkorrektur oder einem Radwechsel ein Reset (Kalibrierung) durchgeführt werden."}, {"id": "s3", "t": "Für neu zugelassene Pkw ist in der EU seit November 2014 ein RDKS vorgeschrieben."}], "fig": null, "figcap": null, "table": null}, {"id": "B1", "sec": "B", "type": "match", "pts": 6, "prompt": "Ordne den Marken 1 bis 6 in Abb. 2 die Bauteile zu.", "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}], "choices": [{"id": "c0", "t": "Bremskraftverstärker"}, {"id": "c1", "t": "Tandem-Hauptbremszylinder"}, {"id": "c2", "t": "Ausgleichsbehälter"}, {"id": "c3", "t": "Hydroaggregat ABS/ESP"}, {"id": "c4", "t": "Bremssattel"}, {"id": "c5", "t": "Raddrehzahlsensor"}, {"id": "c6", "t": "Bremskraftregler (mechanisch)"}, {"id": "c7", "t": "Unterdruckpumpe"}, {"id": "c8", "t": "Radbremszylinder einer Trommelbremse"}], "fig": null, "figcap": null, "mlabel": "Marke"}, {"id": "B2", "sec": "B", "type": "tf", "pts": 4, "prompt": "Aussagen zur Bremsflüssigkeit. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Bremsflüssigkeit auf Glykolbasis ist hygroskopisch, sie nimmt Wasser aus der Luft auf."}, {"id": "s1", "t": "Mit steigendem Wasseranteil sinkt der Siedepunkt; bei starker Erwärmung bilden sich Dampfblasen, das Pedal wird weich."}, {"id": "s2", "t": "Mit 148 °C liegt der gemessene Siedepunkt noch über dem Mindest-Nasssiedepunkt für DOT 4."}, {"id": "s3", "t": "DOT 4 darf mit silikonbasierter DOT-5-Flüssigkeit gemischt werden."}], "fig": null, "figcap": null, "table": null}, {"id": "B3", "sec": "B", "type": "num", "pts": 3, "prompt": "Die Pedalkraft beträgt 150 N, die Pedalübersetzung 4 : 1, der Bremskraftverstärker verstärkt 4-fach. Der Kolben des Hauptbremszylinders hat 22 mm Durchmesser. Berechne den Bremsdruck in bar.", "unit": "bar", "fig": null, "figcap": null, "table": null}, {"id": "B4", "sec": "B", "type": "num", "pts": 3, "prompt": "Berechne die Spannkraft am Bremssattelkolben (Durchmesser 54 mm) bei dem Druck aus B3.", "unit": "kN", "fig": null, "figcap": null, "table": null}, {"id": "B5", "sec": "B", "type": "mc", "pts": 2, "prompt": "Warum ist die Spannkraft am Bremssattel viel größer als die Kraft am Hauptbremszylinder?", "options": [{"id": "o0", "t": "Weil der Bremskraftverstärker im Sattel sitzt."}, {"id": "o1", "t": "Weil der Druck in der Leitung zum Rad ansteigt."}, {"id": "o2", "t": "Weil der Druck überall gleich ist, der Sattelkolben aber eine größere Fläche hat (hydraulische Kraftübersetzung)."}, {"id": "o3", "t": "Weil das ABS den Druck verstärkt."}, {"id": "o4", "t": "Weil die Bremsleitungen elastisch sind."}], "fig": null, "figcap": null, "table": null}, {"id": "B6", "sec": "B", "type": "tf", "pts": 4, "prompt": "Aussagen zur Bremsscheibe vorne links und zur Instandsetzung. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Die Scheibe mit 20,6 mm darf weiter verwendet werden, weil sie nur 0,4 mm unter der Mindestdicke liegt."}, {"id": "s1", "t": "Bremsscheiben und Bremsbeläge werden immer achsweise erneuert."}, {"id": "s2", "t": "Neue Bremsbeläge müssen nach Herstellervorgabe eingebremst werden."}, {"id": "s3", "t": "Dickenunterschiede der Bremsscheibe können zu Pedalpulsieren und Lenkradrubbeln führen."}], "fig": null, "figcap": null, "table": null}, {"id": "B7", "sec": "B", "type": "num", "pts": 3, "prompt": "Abb. 3 zeigt das Signal des aktiven Raddrehzahlsensors hinten rechts. Der Encoder hat 48 Polpaare (48 Signalperioden je Radumdrehung). Berechne die Raddrehzahl.", "unit": "1/min", "fig": "f3", "figcap": "Abb. 3: Stromsignal des aktiven Raddrehzahlsensors hinten rechts", "table": null}, {"id": "B8", "sec": "B", "type": "num", "pts": 3, "prompt": "Berechne die Fahrgeschwindigkeit, die zu dieser Raddrehzahl gehört (dynamischer Abrollumfang 1,95 m).", "unit": "km/h", "fig": null, "figcap": null, "table": null}, {"id": "B9", "sec": "B", "type": "mc", "pts": 2, "prompt": "Woran erkennst du in Abb. 3, dass es sich um einen aktiven Sensor handelt?", "options": [{"id": "o0", "t": "Die Spannung ist sinusförmig und wächst mit der Drehzahl."}, {"id": "o1", "t": "Er liefert ein Stromsignal mit zwei festen Pegeln (z. B. 7 mA und 14 mA), dessen Frequenz sich mit der Drehzahl ändert."}, {"id": "o2", "t": "Er benötigt keine Spannungsversorgung."}, {"id": "o3", "t": "Das Signal ist nur bei hoher Geschwindigkeit vorhanden."}, {"id": "o4", "t": "Er arbeitet ausschließlich mit Lichtwellenleiter."}], "fig": null, "figcap": null, "table": null}, {"id": "C1", "sec": "C", "type": "match", "pts": 7, "prompt": "Ordne den Marken 1 bis 7 in Abb. 4 die Komponenten zu.", "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}, {"id": "m4", "label": "5"}, {"id": "m5", "label": "6"}, {"id": "m6", "label": "7"}], "choices": [{"id": "c0", "t": "HV-Batterie"}, {"id": "c1", "t": "Wartungsstecker (Service-Disconnect)"}, {"id": "c2", "t": "Leistungselektronik (Wechselrichter)"}, {"id": "c3", "t": "E-Maschine"}, {"id": "c4", "t": "DC/DC-Wandler"}, {"id": "c5", "t": "12-V-Bordnetzbatterie"}, {"id": "c6", "t": "Ladeanschluss mit On-Board-Lader"}, {"id": "c7", "t": "Generator Kl. 61"}, {"id": "c8", "t": "Starter"}, {"id": "c9", "t": "Zündspule"}], "fig": null, "figcap": null, "mlabel": "Marke"}, {"id": "C2", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zu Spannungsklassen und Schutzmaßnahmen. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Zur Spannungsklasse B gehören Gleichspannungen über 60 V bis 1 500 V."}, {"id": "s1", "t": "HV-Leitungen sind an ihrer orangefarbenen Isolierung zu erkennen."}, {"id": "s2", "t": "Ein 48-V-Bordnetz gehört zur Spannungsklasse B."}, {"id": "s3", "t": "Beim Potentialausgleich muss der Widerstand zwischen den leitfähigen Gehäusen kleiner als 0,1 Ω sein."}], "fig": null, "figcap": null, "table": null}, {"id": "C3", "sec": "C", "type": "order", "pts": 5, "prompt": "Bringe die fünf Sicherheitsregeln (DIN VDE 0105-100) in die richtige Reihenfolge (oben = zuerst).", "steps": [{"id": "p0", "t": "Freischalten"}, {"id": "p1", "t": "Gegen Wiedereinschalten sichern"}, {"id": "p2", "t": "Spannungsfreiheit feststellen"}, {"id": "p3", "t": "Erden und kurzschließen"}, {"id": "p4", "t": "Benachbarte, unter Spannung stehende Teile abdecken oder abschranken"}]}, {"id": "C4", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zur Qualifikation nach DGUV Information 209-093. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Eine sensibilisierte Person (Stufe S) darf das Fahrzeug bedienen und bewegen."}, {"id": "s1", "t": "Den spannungsfreien Zustand eines HV-Systems darf nur eine Fachkundige Person Hochvolt (Stufe 2S) herstellen."}, {"id": "s2", "t": "Für Arbeiten an unter Spannung stehenden HV-Komponenten ist Stufe 3S erforderlich."}, {"id": "s3", "t": "Mit Stufe 1S darf die HV-Batterie geöffnet und instand gesetzt werden."}], "fig": null, "figcap": null, "table": null}, {"id": "C5", "sec": "C", "type": "num", "pts": 3, "prompt": "Der Mindest-Isolationswiderstand für den betroffenen Stromkreis beträgt 500 Ω je Volt Nennspannung. Berechne den Mindestwert für das 400-V-System.", "unit": "kΩ", "fig": null, "figcap": null, "table": null}, {"id": "C6", "sec": "C", "type": "tf", "pts": 4, "prompt": "Aussagen zur Isolationsmessung. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Die Prüfspannung muss mindestens so hoch sein wie die Nennspannung des HV-Systems."}, {"id": "s1", "t": "Die Isolationsmessung wird mit einem Standard-Multimeter im Ohm-Bereich durchgeführt."}, {"id": "s2", "t": "Gemessen wird zwischen dem HV-Leiter (Plus bzw. Minus) und der Fahrzeugmasse."}, {"id": "s3", "t": "Die Messung erfolgt nur im spannungsfreien Zustand nach Herstellervorgabe."}], "fig": null, "figcap": null, "table": null}, {"id": "C7", "sec": "C", "type": "mc", "pts": 2, "prompt": "Welche Aufgabe hat der Wartungsstecker (Service-Disconnect, Marke 2)?", "options": [{"id": "o0", "t": "Er lädt die 12-V-Batterie."}, {"id": "o1", "t": "Er unterbricht den HV-Stromkreis, meist in der Mitte der HV-Batterie, um das System freizuschalten."}, {"id": "o2", "t": "Er misst den Isolationswiderstand."}, {"id": "o3", "t": "Er verbindet die E-Maschine mit dem Getriebe."}, {"id": "o4", "t": "Er schützt den Ladeanschluss vor Feuchtigkeit."}], "fig": null, "figcap": null, "table": null}, {"id": "C8", "sec": "C", "type": "mc", "pts": 2, "prompt": "Warum muss nach dem Freischalten eine Wartezeit eingehalten werden, bevor die Spannungsfreiheit festgestellt wird?", "options": [{"id": "o0", "t": "Damit die 12-V-Batterie nachladen kann."}, {"id": "o1", "t": "Damit sich die Kondensatoren im Zwischenkreis der Leistungselektronik entladen."}, {"id": "o2", "t": "Damit die HV-Batterie abkühlt."}, {"id": "o3", "t": "Damit das Isolationsmessgerät warm wird."}, {"id": "o4", "t": "Damit der Fehlerspeicher gelöscht wird."}], "fig": null, "figcap": null, "table": null}, {"id": "D1", "sec": "D", "type": "num", "pts": 3, "prompt": "Berechne die Gesamtübersetzung im 2. Gang (Gangübersetzung × Achsübersetzung).", "unit": "", "fig": null, "figcap": null, "table": null}, {"id": "D2", "sec": "D", "type": "num", "pts": 3, "prompt": "Berechne die Drehzahl der Antriebsräder bei 3 000 1/min Motordrehzahl im 2. Gang.", "unit": "1/min", "fig": null, "figcap": null, "table": null}, {"id": "D3", "sec": "D", "type": "match", "pts": 4, "prompt": "Abb. 5 zeigt einen einfachen Planetensatz. Ordne den Marken 1 bis 4 die Bauteile zu.", "markers": [{"id": "m0", "label": "1"}, {"id": "m1", "label": "2"}, {"id": "m2", "label": "3"}, {"id": "m3", "label": "4"}], "choices": [{"id": "c0", "t": "Sonnenrad"}, {"id": "c1", "t": "Planetenrad"}, {"id": "c2", "t": "Planetenträger (Steg)"}, {"id": "c3", "t": "Hohlrad"}, {"id": "c4", "t": "Freilauf"}, {"id": "c5", "t": "Lamellenkupplung"}, {"id": "c6", "t": "Bremsband"}], "fig": "f5", "figcap": "Abb. 5: Einfacher Planetensatz", "mlabel": "Marke"}, {"id": "D4", "sec": "D", "type": "num", "pts": 3, "prompt": "Im Planetensatz (Sonnenrad 30 Zähne, Hohlrad 78 Zähne) ist das Sonnenrad festgehalten. Das Hohlrad treibt an, der Steg treibt ab. Berechne die Übersetzung i = n_Hohlrad / n_Steg.", "unit": "", "fig": null, "figcap": null, "table": null}, {"id": "D5", "sec": "D", "type": "tf", "pts": 4, "prompt": "Aussagen zum Doppelkupplungsgetriebe. Wahr oder falsch?", "statements": [{"id": "s0", "t": "Es besteht aus zwei Teilgetrieben, eines für die geraden und eines für die ungeraden Gänge."}, {"id": "s1", "t": "Die Gangwechsel erfolgen ohne Zugkraftunterbrechung."}, {"id": "s2", "t": "Nach dem Tausch der Doppelkupplung ist keine Grundeinstellung oder Adaption nötig."}, {"id": "s3", "t": "Im gerade nicht aktiven Teilgetriebe kann der nächste Gang bereits vorgewählt sein."}], "fig": null, "figcap": null, "table": null}, {"id": "D6", "sec": "D", "type": "tf", "pts": 4, "prompt": "Aussagen zum Ausgleichsgetriebe (Differenzial). Wahr oder falsch?", "statements": [{"id": "s0", "t": "Es ermöglicht unterschiedliche Raddrehzahlen bei Kurvenfahrt."}, {"id": "s1", "t": "Dreht beim offenen Differenzial ein Rad durch, erhält das haftende Rad mehr Antriebsmoment."}, {"id": "s2", "t": "Die Summe der beiden Raddrehzahlen ist doppelt so groß wie die Drehzahl des Ausgleichsgehäuses."}, {"id": "s3", "t": "Eine Differenzialsperre schränkt den Drehzahlausgleich ein."}], "fig": null, "figcap": null, "table": null}, {"id": "D7", "sec": "D", "type": "mc", "pts": 2, "prompt": "Welche Aufgabe hat die Synchronisierung im Schaltgetriebe?", "options": [{"id": "o0", "t": "Sie verbindet Motor und Getriebe beim Anfahren."}, {"id": "o1", "t": "Sie gleicht über Reibkegel die Drehzahlen von Gangrad und Schaltmuffe an, bevor eingekuppelt wird."}, {"id": "o2", "t": "Sie verhindert das Einlegen des Rückwärtsgangs während der Fahrt durch den Motor."}, {"id": "o3", "t": "Sie kühlt das Getriebeöl."}, {"id": "o4", "t": "Sie verteilt das Moment auf beide Räder."}], "fig": null, "figcap": null, "table": null}, {"id": "D8", "sec": "D", "type": "mc", "pts": 2, "prompt": "Eine Einscheiben-Trockenkupplung rutscht unter Last. Welche Ursache ist am wahrscheinlichsten?", "options": [{"id": "o0", "t": "Zu großes Spiel am Kupplungspedal."}, {"id": "o1", "t": "Verölte oder verschlissene Kupplungsbeläge."}, {"id": "o2", "t": "Defekter Synchronring im 2. Gang."}, {"id": "o3", "t": "Zu niedriger Ölstand im Differenzial."}, {"id": "o4", "t": "Defekter Raddrehzahlsensor."}], "fig": null, "figcap": null, "table": null}, {"id": "D9", "sec": "D", "type": "tf", "pts": 3, "prompt": "Aussagen zum Getriebeöl. Wahr oder falsch?", "statements": [{"id": "s0", "t": "ATF und Hypoidöl können beliebig gegeneinander ausgetauscht werden."}, {"id": "s1", "t": "Bei vielen Schaltgetrieben wird der Ölstand an der Unterkante der Einfüllöffnung geprüft."}, {"id": "s2", "t": "Doppelkupplungsgetriebe mit nassen Kupplungen haben Ölwechselintervalle nach Herstellervorgabe."}], "fig": null, "figcap": null, "table": null}], "blob": "HUADAlRSUVdWG3AJEFxCE0VAQElNDRtSCBBKQkoKHFJRVw9aABoeRkAFVQ9KS1VOCxMUEkQPW0UXUEkUHhsdGBALVkpdDVIIQw9EHRgQJ1BKXQ1SBEYPFREac1VAUkdWUhhHDwMRTEATB0RHDwNaVRcZV1leFQdERw8DWVUXGUVKRwNOSEVeQ0lNDU1DTVcbTkhFbERJTQ1iE0gCRE5IRV1BSVsNG0EKEEpCShceUkdXD0kFGm9KQkomGFJRV1YbRxoIRlRbUwNDR1cPTV5UEFxCWUkYDUdXD3gHGghGGUoUHVJRV1lLRF0eRkAbVg9KSwNfTFQUEkQRWkUXUA0WQUpUFBJEEVtFF1AfBVhcTBQSRCNfRRdQSRgcGx0YECdaSl0NC0kEHRsLGEYUFw1LDVIYRg8DEV5TChENSw1SGEUPAxFMQBMHREcPA1hVFxlFSkcDH0RHDzJaVRcZShpfVkBSRw8TW1UBGRNVA0RYSEV const P = "fbhg-pkw-9182";
const SEC = BUNDLE.sections, ITEMS = BUNDLE.items, FIG = BUNDLE.figs;
const MAX = ITEMS.reduce((a, i) => a + i.pts, 0);

// ---------- Hilfen ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function load() { try { return JSON.parse(localStorage.getItem(CONFIG.STORE)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(CONFIG.STORE, JSON.stringify(S)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(n, d = 1) { return Number(n).toLocaleString("de-DE", { maximumFractionDigits: d }); }
function parseNum(s) { if (s == null) return NaN; const t = String(s).replace(/\s/g, "").replace(/[^0-9,.\-]/g, "").replace(",", "."); return t === "" ? NaN : Number(t); }
let SECRET = null;
function secret() {
  if (SECRET) return SECRET;
  const bin = atob(BUNDLE.blob); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i) ^ P.charCodeAt(i % P.length);
  SECRET = JSON.parse(new TextDecoder().decode(out)); return SECRET;
}

// ---------- Zustand ----------
let S = load() || { phase: "start", name: "", klasse: "", startedAt: 0, layout: {}, answers: {}, touched: {}, result: null };
function makeLayout() {
  const L = {};
  for (const it of ITEMS) {
    if (it.type === "mc") L[it.id] = shuffle(it.options.map(o => o.id));
    if (it.type === "match") L[it.id] = shuffle(it.choices.map(c => c.id));
    if (it.type === "order") { let o; do { o = shuffle(it.steps.map(s => s.id)); } while (o.every((v, i) => v === it.steps[i].id)); L[it.id] = o; }
  }
  return L;
}
function isAnswered(it) {
  const a = S.answers[it.id];
  if (it.type === "mc") return !!a;
  if (it.type === "tf") return a && it.statements.every(s => typeof a[s.id] === "boolean");
  if (it.type === "match") return a && it.markers.every(m => a[m.id]);
  if (it.type === "num") return !isNaN(parseNum(a));
  if (it.type === "order") return !!S.touched[it.id];
  return false;
}

// ---------- Bewertung ----------
function gradeItem(it, a, key) {
  const k = key[it.id];
  if (it.type === "mc") return a === k ? it.pts : 0;
  if (it.type === "tf") return it.statements.reduce((s, st) => s + (a && a[st.id] === k[st.id] ? 1 : 0), 0);
  if (it.type === "match") return it.markers.reduce((s, m) => s + (a && a[m.id] === k[m.id] ? 1 : 0), 0);
  if (it.type === "num") { const v = parseNum(a); return !isNaN(v) && Math.abs(v - k.v) <= k.tol + 1e-9 ? it.pts : 0; }
  if (it.type === "order") { const o = a || []; return k.reduce((s, id, i) => s + (o[i] === id ? 1 : 0), 0); }
  return 0;
}
function grade(answers) {
  const key = secret().key; const per = {}, sec = {};
  for (const s of SEC) sec[s.id] = { got: 0, max: 0 };
  for (const it of ITEMS) { const g = gradeItem(it, answers[it.id], key); per[it.id] = g; sec[it.sec].got += g; sec[it.sec].max += it.pts; }
  const got = Object.values(per).reduce((a, b) => a + b, 0);
  return { got, max: MAX, pct: Math.round(got / MAX * 1000) / 10, per, sec };
}

// ---------- Kopfzeile, Uhr ----------
let tick = null;
function updateBar() {
  const n = ITEMS.filter(isAnswered).length;
  const ans = document.getElementById("answered");
  ans.textContent = `${n} / ${ITEMS.length} beantwortet`;
  document.getElementById("progbar").style.width = (S.phase === "test" ? n / ITEMS.length * 100 : 0) + "%";
  const nav = document.getElementById("secnav");
  if (!nav.childElementCount) for (const sec of SEC) nav.append(el("button", { type: "button", "data-s": sec.id, title: sec.title,
    onclick: () => document.getElementById("sec-" + sec.id)?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" }) }));
  for (const b of nav.children) { const its = ITEMS.filter(i => i.sec === b.dataset.s), k = its.filter(isAnswered).length;
    b.textContent = `${b.dataset.s} ${k}/${its.length}`; b.classList.toggle("full", k === its.length); }
}
function startClock() {
  const c = document.getElementById("clock"); c.classList.remove("hide");
  clearInterval(tick);
  const run = () => {
    const left = Math.max(0, S.startedAt + CONFIG.MINUTES * 60000 - Date.now());
    const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    c.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    c.classList.toggle("warn", left < 5 * 60000);
    if (left <= 0) { clearInterval(tick); if (CONFIG.AUTO_SUBMIT && S.phase === "test") submit(true); }
  };
  run(); tick = setInterval(run, 1000);
}
function chrome(phase) {
  const inTest = phase === "test";
  document.getElementById("foot").classList.toggle("hide", !inTest);
  document.getElementById("answered").classList.toggle("hide", !inTest);
  document.getElementById("clock").classList.toggle("hide", !inTest);
  document.getElementById("secnav").classList.toggle("hide", !inTest);
  const who = document.getElementById("who");
  who.textContent = S.name ? `${S.name}${S.klasse ? " · " + S.klasse : ""}` : "";
  who.classList.toggle("hide", !S.name || phase === "start");
  updateBar();
}

        el("li", { text: "Wahr/Falsch und Zuordnungen werden je Aussage bzw. je Marke mit 1 Punkt bewertet, Rechenwerte nur bei richtigem Ergebnis." }),
        el("li", { text: "Zahlen mit Komma oder Punkt eingeben, ohne Einheit. Hilfsmittel: Tabellenbuch, Taschenrechner." }),
        el("li", { text: `Ab ${CONFIG.THRESHOLD} % der Punkte werden nach der Abgabe alle Lösungen mit Erklärungen freigeschaltet.` }),
        el("li", { text: "Deine Antworten werden in diesem Browser zwischengespeichert. Lade die Seite bei Problemen einfach neu." })

// ---------- Ergebnis ----------

function ansText(it, a) {

      }

    }
  }
}

<script>
// Ergebnisübermittlung an das Google-Formular und Freischaltung weiterer Versuche durch die Lehrkraft.
(function () {
  var ZIEL = "https://docs.google.com/forms/d/e/1FAIpQLSdcwP-6pcZxKWx1WVtMyY-uctAE9VU2PIwVmv36nIRU9xZoZg/formResponse";
  var F = { name: "entry.1310728237", klasse: "entry.1103803953", punkte: "entry.1144687010", prozent: "entry.141246579", details: "entry.1853769831" };
  var CODE_HASH = "d9ea741f356ec854568ce10a8cc477485c72a4522db0e74e7a2b9bf0ffc07574";
  function hinweis(t) { var n = document.getElementById("sendState"); if (n) n.textContent = t; }
  function senden() {
    if (typeof S === "undefined" || !S || !S.result || S.sent) return;
    var r = S.result;
    var teile = SEC.map(function (s) { return s.id + " " + r.sec[s.id].got + "/" + r.sec[s.id].max; }).join(" · ");
    var p = new URLSearchParams();
    p.append(F.name, S.name || "");
    p.append(F.klasse, S.klasse || "");
    p.append(F.punkte, r.got + "/" + r.max);
    p.append(F.prozent, String(r.pct).replace(".", ","));
    p.append(F.details, teile + " · " + r.minutes + " min" + (r.auto ? " · automatisch abgegeben" : "") + (S.attempt > 1 ? " · Versuch " + S.attempt : "") + " · " + new Date(r.at).toLocaleString("de-DE"));
    fetch(ZIEL, { method: "POST", mode: "no-cors", body: p })
      .then(function () { S.sent = true; save(); hinweis("Ergebnis an die Lehrkraft übermittelt."); })
      .catch(function () { hinweis("Ergebnis konnte nicht übermittelt werden. Bitte zeig es deiner Lehrkraft."); });
  }
  async function codeStimmt(code) {
    var b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fbhg-pkw:" + code));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("") === CODE_HASH;
  }
  function freischaltBereich() {
    var karte = document.querySelector("#app section.card");
    if (!karte || !S || S.phase !== "done") return;
    var box = el("div", { style: "margin-top:16px;border-top:1px solid var(--line);padding-top:10px" });
    var knopf = el("button", { type: "button", class: "tbtn", text: "Lehrkraft" });
    var form = el("div", { class: "row hide", style: "margin-top:8px;align-items:center" });
    var feld = el("input", { type: "password", inputmode: "numeric", autocomplete: "off", id: "lkcode", "aria-label": "Code der Lehrkraft", placeholder: "Code",
      style: "border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;width:130px" });
    var ok = el("button", { type: "button", class: "btn", text: "Neuen Versuch freischalten" });
    var meldung = el("p", { class: "note" });
    knopf.addEventListener("click", function () { form.classList.toggle("hide"); feld.focus(); });
    async function freischalten() {
      if (await codeStimmt(feld.value.trim())) {
        var n = (S.attempt || 1) + 1;
        S = { phase: "start", name: S.name, klasse: S.klasse, startedAt: 0, layout: {}, answers: {}, touched: {}, result: null, sent: false, attempt: n };
        save();
        renderStart("Versuch " + n + " ist freigeschaltet. Starte, wenn du bereit bist.");
      } else { meldung.textContent = "Code falsch."; feld.value = ""; feld.focus(); }
    }
    ok.addEventListener("click", freischalten);
    feld.addEventListener("keydown", function (e) { if (e.key === "Enter") freischalten(); });
    form.append(feld, ok); box.append(knopf, form, meldung); karte.append(box);
  }
  var abgeben = window.submit;
  window.submit = function (auto) { var x = abgeben(auto); senden(); return x; };
  var zeigen = window.renderResult;
  window.renderResult = function () { var x = zeigen.apply(this, arguments); freischaltBereich(); return x; };
  if (S && S.phase === "done" && S.result) window.renderResult();
  senden();
})();
