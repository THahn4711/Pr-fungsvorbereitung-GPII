<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nachtest LF 3 · Kapitel 1</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
<style>
:root{--p:#0F766E;--pd:#115E59;--pt:#E3F2EF;--ac:#F2C94C;--at:#FFF6D6;--ak:#7A5A00;--ink:#1F2A2E;--mu:#4B5A5E;--line:#D5DEDC;--bg:#F6F8F7;--card:#fff;--ok:#15803D;--bad:#B42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Comic Neue","Comic Sans MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:3px solid var(--p);padding:8px 14px;display:flex;align-items:center;gap:10px}
header img{height:30px}
header .t{font-weight:700;color:var(--pd);font-size:15px;line-height:1.15;flex:1}
#timer{font-weight:700;font-variant-numeric:tabular-nums;background:var(--pt);color:var(--pd);border-radius:999px;padding:4px 12px;font-size:17px;min-width:76px;text-align:center}
#timer.warn{background:var(--at);color:var(--ak)}#timer.crit{background:#FDE2E0;color:var(--bad)}
#bar{height:5px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
main{max-width:720px;margin:0 auto;padding:14px 14px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:24px;color:var(--pd);margin:4px 0 8px}h2{font-size:17px;color:var(--pd);margin:18px 2px 8px;background:var(--at);border-radius:10px;padding:6px 10px}
.qh{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mu);margin-bottom:4px}
.qh b{color:var(--p)}
.q{font-weight:700;margin:0 0 10px}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
input[type=text]:focus,select:focus{outline:none;border-color:var(--p)}
.btn{font:inherit;font-weight:700;font-size:17px;background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;width:100%}
.btn:disabled{opacity:.45}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:7px 0;cursor:pointer;background:#fff}
.opt input{margin-top:4px;accent-color:var(--p);width:18px;height:18px;flex:none}
.opt.on{border-color:var(--p);background:var(--pt)}
.tf{border-top:1px dashed var(--line);padding:9px 0}.tf:first-of-type{border-top:0}
.tf .bt{display:flex;gap:8px;margin-top:6px}
.tg{flex:1;font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px;cursor:pointer}
.tg.on{border-color:var(--p);background:var(--p);color:#fff}
select{font:inherit;font-size:16px;padding:7px 8px;border:2px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
.mrow{margin:8px 0 12px}.mrow .l{font-weight:700;margin-bottom:4px}.mrow select{width:100%}
.cloze{line-height:2.4}.cloze select{margin:0 2px}
.ord li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff;list-style:none}
.ord ol{padding:0;margin:0}.ord .n{font-weight:700;color:var(--p);min-width:18px}.ord .tx{flex:1}
.ord button{font:inherit;font-size:18px;width:38px;height:38px;border-radius:9px;border:2px solid var(--line);background:var(--pt);cursor:pointer}
.num{display:flex;gap:8px;align-items:center}.num input{max-width:200px}.num .u{font-weight:700}
.dnd svg{width:100%;height:auto;display:block;touch-action:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--p);color:var(--pd);background:#fff;border-radius:999px;padding:7px 12px;cursor:grab;touch-action:none;user-select:none}
.chip.sel{background:var(--p);color:#fff}.chip.used{opacity:.35}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-60%);opacity:.9}
.note{font-size:14px;color:var(--mu)}
.hint{background:var(--at);border-left:5px solid var(--ac);border-radius:10px;padding:10px 12px;margin:10px 0}
.res td,.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.res{width:100%;border-collapse:collapse;font-size:15px}
.big{font-size:40px;font-weight:700;color:var(--pd)}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
footer.sub{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
footer.sub .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
footer.sub .st{font-size:14px;color:var(--mu);flex:1}
footer.sub .btn{width:auto}
.hide{display:none!important}
</style>
</head>

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffle(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a, r) => a[Math.floor(r() * a.length)];

  body: r => { const U = pick([400, 600, 800], r), R = pick([1000, 1600, 2000], r); return { q: `Ein Techniker berührt versehentlich beide Pole eines Hochvoltsystems mit U = ${U} V. Sein Körperwiderstand beträgt R = ${fmt(R, 0)} Ω. Berechne den Strom durch seinen Körper.`, a: U / R * 1000, unit: "mA", tol: 0.02 }; },
  mA: r => { const m = pick([150, 250, 350, 450, 750, 1200], r); return { q: `Rechne um: ${m} mA = ? A`, a: m / 1000, unit: "A", tol: 0.001 }; },
  kOhm: r => { const k = pick([1.2, 2.2, 3.3, 4.7, 6.8], r); return { q: `Rechne um: ${fmt(k, 1)} kΩ = ? Ω`, a: k * 1000, unit: "Ω", tol: 0.001 }; },
  R: r => { const I = pick([6, 8, 10, 12, 15], r); return { q: `Eine Heckscheibenheizung nimmt bei U = 12 V einen Strom von I = ${I} A auf. Berechne ihren Widerstand.`, a: 12 / I, unit: "Ω", tol: 0.02 }; },
  I: r => { const R = pick([4, 6, 8], r), U = pick([10, 11, 13], r); return { q: `Eine Scheinwerferlampe hat den Widerstand R = ${R} Ω. Die Batterie liefert nur noch U = ${U} V. Berechne den Strom (auf zwei Nachkommastellen).`, a: U / R, unit: "A", tol: 0.02 }; },
  U: r => { const c = pick([[8, 1.5], [6, 2], [12, 2], [16, 1.5], [4.8, 2.5]], r); return { q: `Durch eine Lampe mit R = ${fmt(c[0], 1)} Ω fließt ein Strom von I = ${fmt(c[1], 1)} A. Berechne die anliegende Spannung.`, a: c[0] * c[1], unit: "V", tol: 0.01 }; },
  double: r => { const I = pick([4, 5, 6, 8], r); return { q: `Ein Heizlüfter nimmt bei 12 V einen Strom von ${I} A auf. Bei gleicher Spannung wird sein Widerstand verdoppelt. Welcher Strom fließt jetzt?`, a: I / 2, unit: "A", tol: 0.01 }; },
};

function makeLayout(seed) {
  const r = rng(seed), L = {};
  for (const it of ITEMS) {
    if (it.kind === "mc") L[it.id] = { order: shuffle(it.opts.map((_, i) => i), r) };
    if (it.kind === "match") L[it.id] = { rights: shuffle(it.pairs.map(p => p[1]).concat(it.extra || []), r) };
    if (it.kind === "order") L[it.id] = { start: (() => { let o; do o = shuffle(it.steps.map((_, i) => i), r); while (o.every((v, i) => v === i)); return o; })() };
    if (it.kind === "cloze") L[it.id] = { opts: it.gaps.map(g => shuffle(g.opts, r)) };
    if (it.kind === "dnd") L[it.id] = { labels: shuffle(it.labels, r) };
    if (it.kind === "num") L[it.id] = GEN[it.gen](r);
  }
  return L;
}

// ---------- Startseite ----------
function renderStart() {
  $("#foot").classList.add("hide"); $("#timer").classList.add("hide");
  const app = $("#app"); app.innerHTML = "";
  const vn = el("input", { type: "text", id: "vn", autocomplete: "given-name", value: S.vorname || "" });
  const nn = el("input", { type: "text", id: "nn", autocomplete: "family-name", value: S.nachname || "" });
  const kl = el("input", { type: "text", id: "kl", autocomplete: "off", placeholder: "z. B. FKFZ 1", value: S.klasse || "" });
  const go = el("button", { class: "btn", type: "button", text: "Test starten" });
  const chk = () => { go.disabled = !(vn.value.trim().length > 1 && nn.value.trim().length > 1 && kl.value.trim().length > 1); };
  [vn, nn, kl].forEach(x => x.addEventListener("input", chk)); chk();
  go.addEventListener("click", () => {
    if (!confirm("Du hast genau einen Versuch und " + CONFIG.minutes + " Minuten Zeit. Jetzt starten?")) return;
    S = { phase: "test", vorname: vn.value.trim(), nachname: nn.value.trim(), klasse: kl.value.trim(), startedAt: Date.now(), seed: Math.floor(Math.random() * 2 ** 31), answers: {}, away: 0 };
    S.layout = makeLayout(S.seed); save(); renderTest();
  });
  app.append(el("section", { class: "card" },
    el("h1", { text: "Nachtest Kapitel 1" }),
    el("p", { text: "Gefahren des elektrischen Stroms · Stromkreis · Spannung, Strom, Widerstand · Ohm’sches Gesetz" }),
    el("div", { class: "hint", html: "<b>So läuft der Test:</b><br>• " + ITEMS.length + " Aufgaben, " + CONFIG.minutes + " Minuten. Die Zeit ist knapp – arbeite zügig.<br>• Du hast <b>einen</b> Versuch. Nach Ablauf der Zeit wird automatisch abgegeben.<br>• Bleib in diesem Fenster. Das Verlassen der Seite wird mitgezählt.<br>• Dezimalzahlen mit Komma oder Punkt eingeben." }),
    el("label", { class: "f", for: "vn", text: "Vorname" }), vn,
    el("label", { class: "f", for: "nn", text: "Nachname" }), nn,
    el("label", { class: "f", for: "kl", text: "Klasse" }), kl,
    el("div", { style: "height:14px" }), go));
}

// ---------- Test ----------
let tick;
function renderTest() {
  const app = $("#app"); app.innerHTML = "";
  $("#foot").classList.remove("hide"); $("#timer").classList.remove("hide");
  let nr = 0;
  for (const s of SEC) {
    app.append(el("h2", { text: s.id + " · " + s.title }));
    for (const it of ITEMS.filter(i => i.sec === s.id)) { nr++; app.append(renderItem(it, nr)); }
  }
  $("#abgabe").onclick = () => { const offen = ITEMS.length - answered(); if (confirm(offen ? `Noch ${offen} Aufgabe(n) ohne Antwort. Trotzdem abgeben?` : "Test jetzt abgeben?")) submit(false); };
  clearInterval(tick); tick = setInterval(timer, 500); timer(); progress(); window.scrollTo(0, 0);
}
function timer() {
  const left = Math.max(0, S.startedAt + CONFIG.minutes * 60000 - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  const t = $("#timer"); t.textContent = m + ":" + String(s).padStart(2, "0");
  t.className = left < 60000 ? "crit" : left < 180000 ? "warn" : "";
  $("#bar i").style.width = (100 - left / (CONFIG.minutes * 600)) + "%";
  if (left <= 0 && S.phase === "test") submit(true);
}
function set(id, v) { S.answers[id] = v; save(); progress(); }
function isAnswered(it) {
  const a = S.answers[it.id]; if (a == null) return false;
  if (it.kind === "tf") return it.st.every((_, i) => a[i] != null);
  if (it.kind === "match" || it.kind === "cloze") return Object.values(a).filter(x => x).length >= (it.pairs || it.gaps).length;
  if (it.kind === "dnd") return Object.values(a).filter(x => x).length >= it.zones.length;
  if (it.kind === "num") return String(a).trim() !== "";
  return true;
}
function answered() { return ITEMS.filter(isAnswered).length; }
function progress() { $("#prog").textContent = answered() + " von " + ITEMS.length + " beantwortet"; }

function renderItem(it, nr) {
  const c = el("section", { class: "card", id: "q-" + it.id });
  c.append(el("div", { class: "qh" }, el("span", { html: "<b>Aufgabe " + nr + "</b>" }), el("span", { text: it.pts + (it.pts === 1 ? " Punkt" : " Punkte") })));
  const L = S.layout[it.id], A = S.answers[it.id];
  if (it.kind === "num") c.append(el("p", { class: "q", text: L.q })); else c.append(el("p", { class: "q", text: it.q }));
  if (it.kind === "mc") {
    L.order.forEach(i => {
      const inp = el("input", { type: "radio", name: it.id, value: i }); if (A === i) inp.checked = true;
      const lab = el("label", { class: "opt" + (A === i ? " on" : "") }, inp, el("span", { text: it.opts[i] }));
      inp.addEventListener("change", () => { c.querySelectorAll(".opt").forEach(o => o.classList.remove("on")); lab.classList.add("on"); set(it.id, i); });
      c.append(lab);
    });
  }
  if (it.kind === "tf") {
    it.st.forEach((st, i) => {
      const row = el("div", { class: "tf" }, el("div", { text: st[0] }));
      const bt = el("div", { class: "bt" });
      [["wahr", true], ["falsch", false]].forEach(([t, v]) => {
        const b = el("button", { type: "button", class: "tg" + (A && A[i] === v ? " on" : ""), text: t });
        b.addEventListener("click", () => { const a = Object.assign({}, S.answers[it.id]); a[i] = v; set(it.id, a); bt.querySelectorAll(".tg").forEach(x => x.classList.remove("on")); b.classList.add("on"); });
        bt.append(b);
      });
      row.append(bt); c.append(row);
    });
  }
  if (it.kind === "match") {
    it.pairs.forEach((p, i) => {
      const s = el("select", { "aria-label": p[0] }, el("option", { value: "", text: "– bitte wählen –" }), L.rights.map(r => el("option", { value: r, text: r })));
      if (A && A[i]) s.value = A[i];
      s.addEventListener("change", () => { const a = Object.assign({}, S.answers[it.id]); a[i] = s.value; set(it.id, a); });
      c.append(el("div", { class: "mrow" }, el("div", { class: "l", text: p[0] }), s));
    });
  }
  if (it.kind === "cloze") {
    const box = el("div", { class: "cloze" });
    it.text.split("\n").forEach((line, li) => {
      const p = el("div");
      line.split(/(\{\d+\})/).forEach(part => {
        const m = part.match(/^\{(\d+)\}$/);
        if (!m) { p.append(document.createTextNode(part)); return; }
        const g = +m[1];
        const s = el("select", { "aria-label": "Lücke " + (g + 1) }, el("option", { value: "", text: "…" }), L.opts[g].map(o => el("option", { value: o, text: o })));
        if (A && A[g]) s.value = A[g];
        s.addEventListener("change", () => { const a = Object.assign({}, S.answers[it.id]); a[g] = s.value; set(it.id, a); });
        p.append(s);
      });
      box.append(p);
    });
    c.append(box);
  }
  if (it.kind === "order") {
    const cur = (A && A.length ? A : L.start).slice();
    const ol = el("ol"); const wrap = el("div", { class: "ord" }, ol);
    const draw = () => {
      ol.innerHTML = "";
      cur.forEach((si, pos) => {
        const up = el("button", { type: "button", "aria-label": "nach oben", text: "▲" }), dn = el("button", { type: "button", "aria-label": "nach unten", text: "▼" });
        up.disabled = pos === 0; dn.disabled = pos === cur.length - 1;
        up.onclick = () => { [cur[pos - 1], cur[pos]] = [cur[pos], cur[pos - 1]]; set(it.id, cur.slice()); draw(); };
        dn.onclick = () => { [cur[pos + 1], cur[pos]] = [cur[pos], cur[pos + 1]]; set(it.id, cur.slice()); draw(); };
        ol.append(el("li", {}, el("span", { class: "n", text: pos + 1 + "." }), el("span", { class: "tx", text: it.steps[si] }), up, dn));
      });
    };
    draw(); c.append(wrap, el("p", { class: "note", text: "Mit ▲ ▼ verschieben. Die Aufgabe zählt als beantwortet, sobald du einmal verschoben hast." }));
  }
  if (it.kind === "num") {
    const inp = el("input", { type: "text", inputmode: "decimal", autocomplete: "off", value: A ?? "", "aria-label": "Ergebnis in " + L.unit });
    inp.addEventListener("input", () => set(it.id, inp.value));
    c.append(el("div", { class: "num" }, el("span", { text: "Ergebnis:" }), inp, el("span", { class: "u", text: L.unit })));
  }
  if (it.kind === "dnd") c.append(renderDnd(it, L, A));
  return c;
}

// ---------- Drag & Drop auf das Schaltbild ----------
function circuitSVG() {
  return `<svg viewBox="0 0 460 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="460" height="350" fill="#fff"/>
  <g stroke="#1F2A2E" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M60 160 V80 H130"/><path d="M180 80 H300"/><path d="M342 66 H400 V160"/><path d="M400 220 V290 H60 V200"/>
    <rect x="130" y="70" width="50" height="20" rx="4"/><line x1="130" y1="80" x2="180" y2="80"/>
    <line x1="300" y1="80" x2="338" y2="60"/><circle cx="300" cy="80" r="4" fill="#1F2A2E"/><circle cx="342" cy="66" r="4" fill="#1F2A2E"/>
    <circle cx="400" cy="190" r="30"/><line x1="379" y1="169" x2="421" y2="211"/><line x1="421" y1="169" x2="379" y2="211"/>
    <line x1="38" y1="160" x2="82" y2="160"/><line x1="48" y1="172" x2="72" y2="172" stroke-width="7"/><line x1="38" y1="186" x2="82" y2="186"/><line x1="48" y1="198" x2="72" y2="198" stroke-width="7"/>
  </g>
  <text x="14" y="166" font-size="24" font-weight="700" fill="#B42318">+</text><text x="16" y="206" font-size="28" font-weight="700" fill="#115E59">−</text>
  </svg>`;
}
function renderDnd(it, L, A) {
  const ans = Object.assign({}, A);
  const wrap = el("div", { class: "dnd" });
  const holder = el("div", { style: "position:relative" });
  holder.innerHTML = circuitSVG();
  const svg = holder.querySelector("svg");
  const NS = "http://www.w3.org/2000/svg";
  const zoneEls = {};
  for (const z of it.zones) {
    const g = document.createElementNS(NS, "g"); g.setAttribute("data-z", z.id); g.style.cursor = "pointer";
    const r = document.createElementNS(NS, "rect"); Object.entries({ x: z.x, y: z.y, width: 150, height: 44, rx: 10, fill: "#E3F2EF", stroke: "#0F766E", "stroke-width": 2, "stroke-dasharray": "6 4" }).forEach(([k, v]) => r.setAttribute(k, v));
    const t = document.createElementNS(NS, "text"); Object.entries({ x: z.x + 75, y: z.y + 29, "text-anchor": "middle", "font-size": 19, "font-weight": 700, fill: "#115E59" }).forEach(([k, v]) => t.setAttribute(k, v));
    g.append(r, t); svg.append(g); zoneEls[z.id] = { g, r, t };
  }
  const chips = el("div", { class: "chips" });
  let selected = null;
  const draw = () => {
    for (const z of it.zones) { const v = ans[z.id]; zoneEls[z.id].t.textContent = v || "?"; zoneEls[z.id].r.setAttribute("fill", v ? "#FFF6D6" : "#E3F2EF"); zoneEls[z.id].r.setAttribute("stroke-dasharray", v ? "" : "6 4"); }
    chips.querySelectorAll(".chip").forEach(ch => { ch.classList.toggle("used", Object.values(ans).includes(ch.dataset.l)); ch.classList.toggle("sel", ch.dataset.l === selected); });
  };
  const place = (zid, label) => { for (const k in ans) if (ans[k] === label) delete ans[k]; if (label) ans[zid] = label; else delete ans[zid]; selected = null; set(it.id, Object.assign({}, ans)); draw(); };
  for (const z of it.zones) zoneEls[z.id].g.addEventListener("click", () => { if (selected) place(z.id, selected); else if (ans[z.id]) place(z.id, null); });
  const zoneAt = (x, y) => { for (const z of it.zones) { const b = zoneEls[z.id].r.getBoundingClientRect(); if (x >= b.left - 6 && x <= b.right + 6 && y >= b.top - 6 && y <= b.bottom + 6) return z.id; } return null; };
  L.labels.forEach(lab => {
    const ch = el("button", { type: "button", class: "chip", "data-l": lab, text: lab });
    let ghost = null, sx = 0, sy = 0, moved = false;
    ch.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; moved = false; ch.setPointerCapture(e.pointerId); });
    ch.addEventListener("pointermove", e => {
      if (!ch.hasPointerCapture(e.pointerId)) return;
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 8) return;
      moved = true;
      if (!ghost) { ghost = ch.cloneNode(true); ghost.classList.add("ghost", "sel"); document.body.append(ghost); }
      ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
    });
    ch.addEventListener("pointerup", e => {
      if (ghost) { ghost.remove(); ghost = null; }
      if (moved) { const z = zoneAt(e.clientX, e.clientY); if (z) place(z, lab); }
      else { selected = selected === lab ? null : lab; draw(); }
    });
    ch.addEventListener("pointercancel", () => { if (ghost) { ghost.remove(); ghost = null; } });
    chips.append(ch);
  });
  wrap.append(holder, chips, el("p", { class: "note", text: "Feld antippen, das schon belegt ist, macht es wieder frei. Nicht alle Begriffe werden gebraucht." }));
  draw();
  return wrap;
}

// ---------- Auswertung ----------
const half = x => Math.round(x * 2) / 2;
function parseNum(s) { if (s == null) return NaN; s = String(s).trim().replace(/\s/g, "").replace(/[a-zA-ZΩ]+$/, "").replace(",", "."); return s === "" ? NaN : Number(s); }
function score(it) {
  const a = S.answers[it.id], L = S.layout[it.id];
  if (a == null) return 0;
  if (it.kind === "mc") return a === it.a ? it.pts : 0;
  if (it.kind === "tf") return half(it.pts * it.st.filter((s, i) => a[i] === s[1]).length / it.st.length);
  if (it.kind === "match") return half(it.pts * it.pairs.filter((p, i) => a[i] === p[1]).length / it.pairs.length);
  if (it.kind === "cloze") return half(it.pts * it.gaps.filter((g, i) => a[i] === g.a).length / it.gaps.length);
  if (it.kind === "dnd") return half(it.pts * it.zones.filter(z => a[z.id] === z.a).length / it.zones.length);
  if (it.kind === "order") { const ok = a.filter((v, i) => v === i).length; return ok === a.length ? it.pts : (ok >= a.length - 2 && it.pts > 1 ? it.pts / 2 : 0); }
  if (it.kind === "num") { const v = parseNum(a); if (!isFinite(v)) return 0; return Math.abs(v - L.a) <= Math.max(Math.abs(L.a) * L.tol, 1e-9) ? it.pts : 0; }
  return 0;
}
function note(p) { return p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6; }
function submit(auto) {
  if (S.phase !== "test") return;
  clearInterval(tick);
  const max = ITEMS.reduce((s, i) => s + i.pts, 0);
  const per = {}; let got = 0;
  ITEMS.forEach(it => { const g = score(it); per[it.id] = g; got += g; });
  const sec = {}; SEC.forEach(s => { const its = ITEMS.filter(i => i.sec === s.id); sec[s.id] = { got: its.reduce((a, i) => a + per[i.id], 0), max: its.reduce((a, i) => a + i.pts, 0) }; });
  const pct = Math.round(got / max * 1000) / 10;
  S.result = { got, max, pct, note: note(pct), per, sec, auto, minutes: Math.round((Date.now() - S.startedAt) / 6000) / 10, at: Date.now() };
  S.phase = "done"; save(); send(); renderResult();
}
function send() {
  const f = CONFIG.form, r = S.result;
  if (!f || S.sent) { if (!f) S.sendState = "Ergebnis gespeichert (Formular noch nicht eingerichtet)."; return; }
  const teile = SEC.map(s => s.id + " " + String(r.sec[s.id].got).replace(".", ",") + "/" + r.sec[s.id].max).join(" · ");
  const p = new URLSearchParams();
  p.append(f.name, S.nachname + ", " + S.vorname); p.append(f.klasse, S.klasse);
  p.append(f.punkte, String(r.got).replace(".", ",") + "/" + r.max); p.append(f.prozent, String(r.pct).replace(".", ","));
  p.append(f.details, "Note " + r.note + " · " + teile + " · " + String(r.minutes).replace(".", ",") + " min" + (r.auto ? " · Zeit abgelaufen" : "") + (S.away ? " · Seite verlassen: " + S.away + "×" : "") + " · " + new Date(r.at).toLocaleString("de-DE"));
  fetch(f.url, { method: "POST", mode: "no-cors", body: p }).then(() => { S.sent = true; S.sendState = "Ergebnis an die Lehrkraft übermittelt."; save(); const n = $("#send"); if (n) n.textContent = S.sendState; })
    .catch(() => { const n = $("#send"); if (n) n.textContent = "Ergebnis konnte nicht übermittelt werden. Zeig diese Seite deiner Lehrkraft."; });
}
function renderResult() {
  $("#foot").classList.add("hide"); $("#timer").classList.add("hide"); $("#bar i").style.width = "100%";
  const r = S.result, app = $("#app"); app.innerHTML = ""; window.scrollTo(0, 0);
  const tb = el("table", { class: "res" }, el("tr", {}, el("th", { text: "Bereich" }), el("th", { text: "Punkte" })),
    SEC.map(s => el("tr", {}, el("td", { text: s.id + " · " + s.title }), el("td", { text: String(r.sec[s.id].got).replace(".", ",") + " / " + r.sec[s.id].max }))));
  let nr = 0;
  const det = el("table", { class: "res" }, el("tr", {}, el("th", { text: "Aufgabe" }), el("th", { text: "Punkte" })),
    SEC.flatMap(s => ITEMS.filter(i => i.sec === s.id)).map(it => { nr++; const g = r.per[it.id]; return el("tr", {}, el("td", { text: "Aufgabe " + nr }), el("td", { class: g === it.pts ? "okc" : g === 0 ? "badc" : "", text: String(g).replace(".", ",") + " / " + it.pts })); }));
  app.append(el("section", { class: "card" },
    el("h1", { text: "Dein Ergebnis" }),
    el("p", { text: S.vorname + " " + S.nachname + " · " + S.klasse }),
    el("div", { class: "big", text: String(r.got).replace(".", ",") + " / " + r.max + " Punkte" }),
    el("p", { html: "<b>" + String(r.pct).replace(".", ",") + " %</b> · Note <b>" + r.note + "</b> " + (r.pct >= 50 ? "<span class='okc'>bestanden</span>" : "<span class='badc'>nicht bestanden</span>") }),
    r.auto ? el("p", { class: "note", text: "Die Zeit war abgelaufen, der Test wurde automatisch abgegeben." }) : null,
    el("p", { class: "note", id: "send", text: S.sendState || "Ergebnis wird übermittelt …" }),
    tb, el("h2", { text: "Punkte je Aufgabe" }), det,
    el("p", { class: "note", text: "Notenschlüssel: 100–92 % = 1 · 91–81 % = 2 · 80–67 % = 3 · 66–50 % = 4 · 49–30 % = 5 · 29–0 % = 6. Dieser Test kann nur einmal bearbeitet werden." })));
}
document.addEventListener("visibilitychange", () => { if (document.hidden && S.phase === "test") { S.away = (S.away || 0) + 1; save(); } });

if (S.phase === "test") { if (Date.now() > S.startedAt + CONFIG.minutes * 60000) submit(true); else renderTest(); }
else if (S.phase === "done") { renderResult(); if (!S.sent) send(); }
else renderStart();
</script>
